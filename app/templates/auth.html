<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AppManager Pro — Sign In</title>
  <link rel="icon" type="image/png" href="/assets/icon.png" />
  <link rel="apple-touch-icon" href="/assets/icon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/css/glass.css" />
  <script>
    if (localStorage.getItem('amp_theme') === 'light') {
      document.documentElement.classList.remove('dark');
      document.documentElement.classList.add('light');
    }
  </script>
</head>
<body class="flex items-center justify-center p-4" x-data="authApp({{ 'true' if is_setup else 'false' }})">
  <div class="ambient-bg">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
  </div>

  <!-- Thanh đổi Theme & Ngôn ngữ góc phải -->
  <div class="fixed top-4 right-4 flex items-center gap-2">
    <button @click="toggleLang()" class="glass-btn px-3 py-1.5 rounded-xl text-xs font-semibold">
      <span x-text="lang === 'vi' ? 'VN' : 'EN'"></span>
    </button>
    <button @click="toggleTheme()" class="glass-btn px-3 py-1.5 rounded-xl text-xs font-semibold">
      <span x-text="theme === 'dark' ? '☀️' : '🌙'"></span>
    </button>
  </div>

  <div class="glass-panel w-full max-w-md rounded-3xl p-8">
    <div class="flex flex-col items-center text-center mb-7">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-sky-400/30 to-indigo-500/30 border border-white/25 flex items-center justify-center mb-4 shadow-lg overflow-hidden">
        <img src="/assets/icon.png" alt="AppManager Pro" class="w-12 h-12 object-contain"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
        <svg style="display:none" class="w-9 h-9 text-sky-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight">AppManager Pro</h1>
      <p class="text-sm text-muted mt-1" x-text="isSetup ? t('setupSubtitle') : t('loginSubtitle')"></p>
    </div>

    <div x-show="error" x-cloak class="mb-4 px-4 py-3 rounded-2xl bg-rose-500/20 border border-rose-400/40 text-rose-200 text-sm">
      <span x-text="error"></span>
    </div>

    <form @submit.prevent="submit()" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-muted mb-1.5" x-text="t('username')"></label>
        <input type="text" x-model="username" required autocomplete="username" minlength="3"
               class="glass-input w-full rounded-2xl px-4 py-3 text-sm" placeholder="admin" />
      </div>

      <div>
        <label class="block text-xs font-medium text-muted mb-1.5" x-text="t('password')"></label>
        <div class="relative">
          <input :type="showPw ? 'text' : 'password'" x-model="password" required
                 :autocomplete="isSetup ? 'new-password' : 'current-password'"
                 :minlength="isSetup ? 8 : 1"
                 class="glass-input w-full rounded-2xl px-4 py-3 pr-12 text-sm" placeholder="••••••••" />
          <button type="button" @click="showPw = !showPw"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-muted hover:text-sky-400 px-1.5 py-1">
            <span x-text="showPw ? t('hide') : t('show')"></span>
          </button>
        </div>
      </div>

      <template x-if="isSetup">
        <div>
          <label class="block text-xs font-medium text-muted mb-1.5" x-text="t('confirmPassword')"></label>
          <input :type="showPw ? 'text' : 'password'" x-model="confirmPassword" required
                 autocomplete="new-password" minlength="8"
                 class="glass-input w-full rounded-2xl px-4 py-3 text-sm" placeholder="••••••••" />
        </div>
      </template>

      <template x-if="!isSetup">
        <label class="flex items-center gap-2.5 text-sm text-muted cursor-pointer select-none pt-1">
          <input type="checkbox" x-model="remember" class="w-4 h-4 rounded accent-sky-500" />
          <span x-text="t('remember')"></span>
        </label>
      </template>

      <button type="submit" :disabled="loading"
              class="glass-btn-primary w-full rounded-2xl py-3.5 text-sm font-semibold mt-2 disabled:opacity-60">
        <span x-show="!loading" x-text="isSetup ? t('createAdmin') : t('signIn')"></span>
        <span x-show="loading" x-cloak x-text="t('processing')"></span>
      </button>
    </form>

    <div class="text-center text-xs text-muted mt-6">
      AppManager Pro v{{ version }}
    </div>
  </div>

  <script>
    function authApp(isSetup) {
      const dict = {
        en: {
          setupSubtitle: 'Create your administrator account to secure Docker access',
          loginSubtitle: 'Sign in to manage your Docker & CasaOS apps',
          username: 'Username',
          password: 'Password',
          confirmPassword: 'Confirm Password',
          remember: 'Keep me signed in for 30 days',
          createAdmin: 'Create Admin Account',
          signIn: 'Sign In',
          processing: 'Please wait...',
          show: 'Show',
          hide: 'Hide',
          mismatch: 'Passwords do not match'
        },
        vi: {
          setupSubtitle: 'Tạo tài khoản Quản trị viên cho lần chạy đầu tiên',
          loginSubtitle: 'Đăng nhập để quản lý ứng dụng Docker & CasaOS',
          username: 'Tên đăng nhập',
          password: 'Mật khẩu',
          confirmPassword: 'Xác nhận mật khẩu',
          remember: 'Ghi nhớ đăng nhập 30 ngày',
          createAdmin: 'Tạo tài khoản Admin',
          signIn: 'Đăng nhập',
          processing: 'Đang xử lý...',
          show: 'Hiện',
          hide: 'Ẩn',
          mismatch: 'Mật khẩu xác nhận không khớp'
        }
      };

      return {
        isSetup,
        lang: localStorage.getItem('amp_lang') || 'vi',
        theme: localStorage.getItem('amp_theme') || 'dark',
        username: '',
        password: '',
        confirmPassword: '',
        remember: true,
        showPw: false,
        loading: false,
        error: '',

        t(key) { return (dict[this.lang] || dict.en)[key] || key; },
        toggleLang() {
          this.lang = this.lang === 'vi' ? 'en' : 'vi';
          localStorage.setItem('amp_lang', this.lang);
        },
        toggleTheme() {
          this.theme = this.theme === 'dark' ? 'light' : 'dark';
          localStorage.setItem('amp_theme', this.theme);
          document.documentElement.classList.toggle('light', this.theme === 'light');
          document.documentElement.classList.toggle('dark', this.theme === 'dark');
        },
        async submit() {
          this.error = '';
          if (this.isSetup && this.password !== this.confirmPassword) {
            this.error = this.t('mismatch');
            return;
          }
          this.loading = true;
          try {
            const url = this.isSetup ? '/api/auth/setup' : '/api/auth/login';
            const body = this.isSetup
              ? { username: this.username, password: this.password, confirm_password: this.confirmPassword }
              : { username: this.username, password: this.password, remember: this.remember };
            const res = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Authentication failed');
            window.location.href = '/';
          } catch (err) {
            this.error = err.message;
          } finally {
            this.loading = false;
          }
        }
      };
    }
  </script>
</body>
</html>
