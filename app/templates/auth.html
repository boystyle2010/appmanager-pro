<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07080c" id="meta-theme-color" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script>/* PWA (thêm vào MH chính): chữ trạng thái iPhone đè lên trang -> chừa thêm chỗ */try{if(navigator.standalone||matchMedia("(display-mode: standalone)").matches)document.documentElement.classList.add("pwa")}catch(e){}</script>
  <link rel="manifest" href="/manifest.json" />
  <title>AppManager Pro — Sign In</title>
  <link rel="icon" type="image/png" href="/assets/icon.png" />
  <link rel="apple-touch-icon" href="/assets/icon.png" />
    <link href="/static/vendor/fonts-auth.css?v={{ build }}" rel="stylesheet" onerror="this.onerror=null;this.href='https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap'" />
  <!-- Tailwind CSS v4 đã biên dịch sẵn lúc build image; thiếu file thì dùng bản chạy trong trình duyệt -->
  <link rel="stylesheet" href="/static/css/tailwind.css?v={{ build }}"
        onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4';document.head.appendChild(s)" />
  <script defer src="/static/vendor/alpine.min.js?v={{ build }}"></script>
  <script>window.addEventListener('load',function(){if(!window.Alpine){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/alpinejs@3.17.5/dist/cdn.min.js';document.head.appendChild(s)}});</script>
  <link rel="stylesheet" href="/static/css/glass.css?v={{ build }}" />
  <style>
    /* Trang đăng nhập (0.25.1): phòng máy tối, bấm nút nguồn máy chủ -> máy chiếu hologram chiếu sáng ô đăng nhập.
       Không có JS / Alpine lỗi -> ô đăng nhập vẫn hiện (chỉ ẩn khi body có lp-ready + lp-off). */
    body.lp { position: relative; }
    body.lp { background: radial-gradient(120% 90% at 30% 20%, #10131b 0%, #07080c 60%, #040507 100%) fixed; color: #e8eaf0; min-height: 100lvh; overflow-x: hidden; }
    .lp { --lamp: 242 244 248; --lamp-ink: #0b0d12; }
    .lp-stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .lp-star { position: absolute; width: 2px; height: 2px; border-radius: 9999px; background: #fff; opacity: .25; animation: lp-twinkle 4s ease-in-out infinite; }
    @keyframes lp-twinkle { 0%, 100% { opacity: .12; } 50% { opacity: .55; } }
    .lp-beam { position: absolute; left: 0; top: 0; width: 100%; pointer-events: none; z-index: 1; opacity: 0; transition: opacity .6s ease; }
    .lp-on .lp-beam { opacity: 1; animation: lp-flicker .7s linear 1; }
    @keyframes lp-flicker { 0% { opacity: 0; } 12% { opacity: .9; } 20% { opacity: .15; } 32% { opacity: 1; } 40% { opacity: .35; } 55%, 100% { opacity: 1; } }
    .lp-room { position: relative; z-index: 2; }
    /* máy chủ + máy chiếu hologram */
    .lp-lamp { width: 152px; height: 190px; flex: none; position: relative; }
    @media (min-width: 768px) { .lp-lamp { width: 240px; height: 300px; } }
    .lp-lamp svg { width: 100%; height: 100%; overflow: visible; }
    .lp-led { fill: #2b2f38; }
    .lp-on .lp-led { fill: rgb(var(--lamp)); animation: lp-blink 1.6s steps(2, jump-none) infinite; filter: drop-shadow(0 0 3px rgb(var(--lamp))); }
    .lp-on .lp-led.lp-steady { animation: none; fill: #4ade80; filter: drop-shadow(0 0 3px #4ade80); }
    @keyframes lp-blink { 0% { opacity: 1; } 50% { opacity: .25; } 100% { opacity: 1; } }
    .lp-lens { fill: #1a1d24; transition: fill .3s ease; }
    .lp-on .lp-lens { fill: rgb(var(--lamp)); filter: drop-shadow(0 0 9px rgb(var(--lamp))); }
    .lp-glow { opacity: 0; transition: opacity .5s ease; }
    .lp-on .lp-glow { opacity: 1; }
    .lp-scan { opacity: 0; }
    .lp-on .lp-scan { opacity: .9; animation: lp-scan 2.4s linear infinite; }
    @keyframes lp-scan { 0% { transform: translateX(0); } 100% { transform: translateX(34px); } }
    .lp-power { cursor: pointer; transition: transform .12s ease; transform-box: fill-box; transform-origin: center; outline: none; }
    .lp-power:active { transform: scale(.88); }
    .lp-power-ring { stroke: #d9b14a; }
    .lp-on .lp-power-ring { stroke: rgb(var(--lamp)); filter: drop-shadow(0 0 5px rgb(var(--lamp))); }
    .lp-power:focus-visible .lp-power-ring { stroke-width: 3.4; }
    .lp-hit { animation: lp-pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .lp-on .lp-hit { animation: none; opacity: 0; }
    @keyframes lp-pulse { 0%, 100% { opacity: .0; transform: scale(.9); } 50% { opacity: .55; transform: scale(1.25); } }
    .lp-hint { font-size: 11px; color: #8a90a0; text-align: center; transition: opacity .4s ease; white-space: nowrap; }
    .lp-on .lp-hint { opacity: 0; }
    /* ô đăng nhập */
    .lp-card { background: rgba(17, 19, 26, .86); border: 1px solid rgba(255, 255, 255, .08); border-radius: 26px;
      box-shadow: 0 30px 80px -30px rgb(0 0 0 / .9), 0 0 0 1px rgb(var(--lamp) / .04), 0 0 90px -30px rgb(var(--lamp) / .55);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      transition: opacity .55s ease .15s, transform .55s cubic-bezier(.2, .8, .2, 1) .15s, visibility 0s linear 0s, box-shadow .4s ease; }
    .lp-ready.lp-off .lp-card { opacity: 0; transform: translateY(14px) scale(.97); visibility: hidden; pointer-events: none;
      transition: opacity .3s ease, transform .3s ease, visibility 0s linear .3s; }
    .lp-card .glass-input { background: rgba(255, 255, 255, .035); border-color: rgba(255, 255, 255, .08); color: #e8eaf0; }
    .lp-card .glass-input:focus { border-color: rgb(var(--lamp) / .7); box-shadow: 0 0 0 3px rgb(var(--lamp) / .16); }
    .lp-btn { background: linear-gradient(180deg, rgb(var(--lamp)) 0%, rgb(var(--lamp) / .82) 100%); color: var(--lamp-ink);
      box-shadow: 0 10px 28px -10px rgb(var(--lamp) / .75), inset 0 1px 0 rgb(255 255 255 / .35); transition: filter .15s ease, transform .12s ease; }
    .lp-btn:hover { filter: brightness(1.06); } .lp-btn:active { transform: scale(.985); }
    .lp-check { accent-color: rgb(var(--lamp)); }
    .lp-dot { width: 18px; height: 18px; border-radius: 9999px; border: 2px solid transparent; transition: transform .15s ease, border-color .15s ease; }
    .lp-dot[aria-pressed="true"] { border-color: #fff; transform: scale(1.12); }
    .lp-pill { background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .08); }
    @media (prefers-reduced-motion: reduce) { .lp-on .lp-beam { animation: none; } .lp-star { animation: none; } .lp-card { transition: none; } .lp-on .lp-led, .lp-on .lp-scan, .lp-hit { animation: none; } }
  </style>
</head>
<body class="lp" x-data="authApp({{ 'true' if is_setup else 'false' }})" :class="{ 'lp-ready': ready, 'lp-on': lampOn, 'lp-off': !lampOn }"
      :style="`--lamp: ${lampColors[color]}`">
  <div class="lp-stars" x-ref="stars"></div>
  <!-- Chùm sáng: đa giác từ miệng chao đèn tới ô đăng nhập (tính lại khi đổi cỡ màn hình) -->
  <svg class="lp-beam" aria-hidden="true" :style="`height: ${beam.h}px`">
    <defs>
      <radialGradient id="lpBeamGrad" gradientUnits="userSpaceOnUse" :cx="beam.cx" :cy="beam.cy" :r="beam.r">
        <stop offset="0" :stop-color="`rgb(${lampColors[color]})`" stop-opacity=".55"/>
        <stop offset=".55" :stop-color="`rgb(${lampColors[color]})`" stop-opacity=".16"/>
        <stop offset="1" :stop-color="`rgb(${lampColors[color]})`" stop-opacity="0"/>
      </radialGradient>
      <filter id="lpBeamBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    </defs>
    <polygon :points="beam.points" fill="url(#lpBeamGrad)" filter="url(#lpBeamBlur)"/>
  </svg>

  <!-- Thanh trên: màu đèn + ngôn ngữ -->
  <div class="fixed inset-x-0 z-20 flex items-center justify-between px-4" style="top: calc(0.75rem + env(safe-area-inset-top));">
    <div class="lp-pill flex items-center gap-2 px-2.5 py-2 rounded-full" role="group" :aria-label="t('lampColor')">
      <template x-for="c in Object.keys(lampColors)" :key="c">
        <button type="button" class="lp-dot" :style="`background: rgb(${lampColors[c]})`" :aria-pressed="color === c"
                :aria-label="c" @click="setColor(c)"></button>
      </template>
    </div>
    <button @click="toggleLang()" type="button" class="lp-pill px-3 py-1.5 rounded-full text-xs font-semibold text-[#c9cdd8]">
      <span x-text="lang === 'vi' ? 'VN' : 'EN'"></span>
    </button>
  </div>

  <div class="lp-room min-h-[100lvh] flex flex-col md:flex-row items-center justify-center gap-2 md:gap-44 px-5 pb-10 safe-bottom"
       style="padding-top: calc(4.25rem + env(safe-area-inset-top));">
    <!-- Máy chủ + máy chiếu hologram (tự vẽ) -->
    <div class="flex flex-col items-center self-start md:self-center ml-2 md:ml-0 md:mt-0">
      <div class="lp-lamp">
        <svg viewBox="0 0 200 250">
          <defs>
            <linearGradient id="lpRack" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c2f38"/><stop offset="1" stop-color="#14161b"/></linearGradient>
            <linearGradient id="lpUnit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f2229"/><stop offset="1" stop-color="#17191f"/></linearGradient>
            <radialGradient id="lpHalo"><stop offset="0" :stop-color="`rgb(${lampColors[color]})`" stop-opacity=".6"/><stop offset="1" :stop-color="`rgb(${lampColors[color]})`" stop-opacity="0"/></radialGradient>
          </defs>
          <ellipse cx="80" cy="241" rx="70" ry="8" fill="#000" opacity=".55"/>
          <!-- máy chủ 3 tầng -->
          <rect x="18" y="96" width="124" height="140" rx="11" fill="url(#lpRack)" stroke="#3a3e48"/>
          <rect x="30" y="232" width="16" height="7" rx="2" fill="#23262e"/><rect x="114" y="232" width="16" height="7" rx="2" fill="#23262e"/>
          <rect x="27" y="106" width="106" height="36" rx="6" fill="url(#lpUnit)" stroke="#2e3139"/>
          <path d="M36 115v18M42 115v18M48 115v18M54 115v18" stroke="#30343d" stroke-width="2.4" stroke-linecap="round"/>
          <rect x="64" y="118" width="32" height="12" rx="2.5" fill="#101216" stroke="#2c2f37"/><rect x="68" y="123" width="18" height="2" rx="1" fill="#2a2d35"/>
          <rect x="27" y="148" width="106" height="36" rx="6" fill="url(#lpUnit)" stroke="#2e3139"/>
          <path d="M36 157v18M42 157v18M48 157v18M54 157v18" stroke="#30343d" stroke-width="2.4" stroke-linecap="round"/>
          <rect x="64" y="160" width="32" height="12" rx="2.5" fill="#101216" stroke="#2c2f37"/><rect x="68" y="165" width="18" height="2" rx="1" fill="#2a2d35"/>
          <rect x="27" y="190" width="106" height="36" rx="6" fill="url(#lpUnit)" stroke="#2e3139"/>
          <path d="M36 199v18M42 199v18M48 199v18M54 199v18" stroke="#30343d" stroke-width="2.4" stroke-linecap="round"/>
          <rect x="64" y="202" width="32" height="12" rx="2.5" fill="#101216" stroke="#2c2f37"/><rect x="68" y="207" width="18" height="2" rx="1" fill="#2a2d35"/>
          <!-- đèn LED (tầng 1, 2) -->
          <circle class="lp-led lp-steady" cx="112" cy="124" r="3"/><circle class="lp-led" cx="122" cy="124" r="3" style="animation-delay: .3s"/>
          <circle class="lp-led lp-steady" cx="112" cy="166" r="3"/><circle class="lp-led" cx="122" cy="166" r="3" style="animation-delay: .9s"/>
          <circle class="lp-led" cx="104" cy="208" r="2.4" style="animation-delay: .5s"/>
          <!-- máy chiếu hologram trên nóc, ống kính hướng sang phải / xuống ô đăng nhập -->
          <rect x="40" y="64" width="72" height="32" rx="8" fill="url(#lpRack)" stroke="#3a3e48"/>
          <rect x="49" y="74" width="28" height="3" rx="1.5" fill="#2a2d35"/><rect x="49" y="80" width="20" height="3" rx="1.5" fill="#2a2d35"/>
          <rect x="110" y="66" width="14" height="28" rx="4" fill="#23262e" stroke="#3a3e48"/>
          <circle class="lp-glow" cx="132" cy="80" r="36" fill="url(#lpHalo)"/>
          <ellipse cx="127" cy="80" rx="7" ry="15" fill="#101216" stroke="#d9b14a" stroke-width="2.2"/>
          <ellipse class="lp-lens" cx="127.8" cy="80" rx="4.2" ry="10"/>
          <rect class="lp-scan" x="49" y="89" width="10" height="1.8" rx=".9" :fill="`rgb(${lampColors[color]})`"/>
          <circle x-ref="rimA" cx="130" cy="64" r=".5" fill="none"/>
          <circle x-ref="rimB" cx="130" cy="96" r=".5" fill="none"/>
          <circle x-ref="mouth" cx="132" cy="80" r=".5" fill="none"/>
          <!-- nút nguồn: chạm để khởi động / tắt -->
          <g class="lp-power" @click="toggleLamp()" @keydown.enter.prevent="toggleLamp()" @keydown.space.prevent="toggleLamp()"
             role="button" tabindex="0" :aria-label="t('pullHint')" :aria-pressed="lampOn">
            <circle class="lp-hit" cx="120" cy="208" r="12" fill="none" stroke="#d9b14a" stroke-width="1.5"/>
            <circle cx="120" cy="208" r="10" fill="#101216"/>
            <circle class="lp-power-ring" cx="120" cy="208" r="10" fill="none" stroke-width="2.2"/>
            <path class="lp-power-ring" d="M116.3 204.6a5.2 5.2 0 1 0 7.4 0M120 202v5.4" fill="none" stroke-width="2" stroke-linecap="round"/>
            <circle cx="120" cy="208" r="22" fill="transparent"/>
          </g>
        </svg>
      </div>
      <p class="lp-hint -mt-1 md:mt-1" x-text="t('pullHint')"></p>
    </div>

    <!-- Ô đăng nhập -->
    <div class="w-full max-w-[380px] relative" x-ref="cardBox">
      <div class="lp-card relative p-6 sm:p-7">
        <div class="flex items-center gap-2.5 mb-5">
          <div class="brand-squircle w-9 h-9 shrink-0"><img src="/assets/icon.png" alt="AppManager Pro" /></div>
          <div class="flex items-center gap-1.5">
            <span class="text-[15px] font-bold tracking-tight">App Manager</span>
            <span class="pro-badge !h-[18px] !text-[10px] !px-1.5 !rounded-[5px]">PRO</span>
          </div>
        </div>
        <h1 class="text-[26px] font-bold leading-tight tracking-tight" x-text="mode === 'signup' ? (isSetup ? t('setupTitle') : t('signupTitle')) : t('welcome')"></h1>
        <p class="text-[13px] text-[#8a90a0] mt-1 mb-4 leading-relaxed" x-text="mode === 'signup' ? (isSetup ? t('setupSubtitle') : t('signupSubtitle')) : t('loginSubtitle')"></p>
        <!-- Đăng nhập / Đăng ký -->
        <div class="grid grid-cols-2 gap-1 p-1 mb-5 rounded-2xl bg-white/[0.04] border border-white/[0.07]" role="tablist">
          <template x-for="m in ['signin', 'signup']" :key="m">
            <button type="button" role="tab" :aria-selected="mode === m" @click="mode = m; error = ''"
                    class="py-2.5 rounded-xl text-[13px] font-semibold transition"
                    :class="mode === m ? 'bg-white/[0.09] text-white shadow-[inset_0_1px_0_rgb(255_255_255/.08)]' : 'text-[#8a90a0] hover:text-white'"
                    ><span x-text="m === 'signin' ? t('tabSignIn') : t('tabSignUp')"></span><span x-show="isSetup && m === 'signup' && mode !== 'signup'" class="keep-round inline-block w-1.5 h-1.5 rounded-full bg-amber-400 ml-1.5 align-middle"></span></button>
          </template>
        </div>

        <div x-show="error" x-cloak x-transition
             class="mb-4 px-3.5 py-3 rounded-2xl bg-rose-500/15 border border-rose-500/35 text-rose-300 text-xs font-medium flex items-start gap-2.5">
          <svg class="w-4 h-4 shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 8v4m0 4h.01"/>
          </svg>
          <span x-text="error"></span>
        </div>

        <!-- Đăng ký: AppManager không tự đăng ký bằng mật khẩu (bảo vệ Docker) — Quản trị tạo tài khoản, hoặc SSO tự tạo -->
        <div x-show="!isSetup && mode === 'signup'" x-cloak class="space-y-3">
          <a x-show="sso.enabled && sso.signup" :href="'/api/auth/oidc/login?remember=' + (remember ? 1 : 0)"
             class="lp-btn w-full rounded-2xl py-3.5 text-sm font-bold flex items-center justify-center gap-2">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path :d="providerIcon()"/></svg>
            <span x-text="t('ssoSignup').replace('{p}', sso.label)"></span>
          </a>
          <p x-show="sso.enabled && sso.signup" class="text-[11.5px] text-[#8a90a0] leading-relaxed px-1" x-text="t('ssoSignupNote')"></p>
          <div class="rounded-2xl bg-white/[0.035] border border-white/[0.08] p-3.5 flex gap-3">
            <span class="w-9 h-9 rounded-xl shrink-0 flex items-center justify-center bg-white/[0.06] text-[#c9cdd8]">
              <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zM3 19.235v-.11a6.375 6.375 0 0112.75 0v.109A12.318 12.318 0 019.374 21c-2.331 0-4.512-.645-6.374-1.766z"/></svg>
            </span>
            <div class="min-w-0">
              <p class="text-[13px] font-semibold" x-text="t('signupAdminTitle')"></p>
              <p class="text-[11.5px] text-[#8a90a0] leading-relaxed mt-0.5" x-text="t('signupAdminDesc')"></p>
            </div>
          </div>
          <div class="rounded-2xl bg-white/[0.035] border border-white/[0.08] p-3.5 flex gap-3">
            <span class="w-9 h-9 rounded-xl shrink-0 flex items-center justify-center bg-white/[0.06] text-[#c9cdd8]">
              <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 14.25h13.5m-13.5 0a3 3 0 01-3-3m3 3a3 3 0 100 6h13.5a3 3 0 100-6m-16.5-3a3 3 0 013-3h13.5a3 3 0 013 3m-19.5 0a4.5 4.5 0 01.9-2.7L5.737 5.1a3.375 3.375 0 012.7-1.35h7.126c1.062 0 2.062.5 2.7 1.35l2.587 3.45a4.5 4.5 0 01.9 2.7m0 0a3 3 0 01-3 3m0 3h.008v.008h-.008v-.008zm0-6h.008v.008h-.008v-.008z"/></svg>
            </span>
            <div class="min-w-0">
              <p class="text-[13px] font-semibold" x-text="t('otherMachineTitle')"></p>
              <p class="text-[11.5px] text-[#8a90a0] leading-relaxed mt-0.5" x-text="t('otherMachineDesc')"></p>
            </div>
          </div>
          <button type="button" @click="mode = 'signin'" class="w-full py-3 rounded-2xl text-sm font-semibold bg-white/[0.04] border border-white/10 hover:bg-white/[0.07] transition" x-text="t('haveAccount')"></button>
        </div>
        <!-- Máy chưa có tài khoản: tab Đăng ký = tạo tài khoản Quản trị đầu tiên -->
        <div x-show="isSetup && mode === 'signup'" x-cloak class="mb-4 rounded-2xl bg-amber-400/[0.07] border border-amber-300/20 p-3.5 flex gap-3">
          <span class="w-9 h-9 rounded-xl shrink-0 flex items-center justify-center bg-amber-400/15 text-amber-300">
            <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/></svg>
          </span>
          <p class="text-[11.5px] text-[#c9cdd8] leading-relaxed" x-text="t('setupNote')"></p>
        </div>

        <form x-show="mode === 'signin' || isSetup" @submit.prevent="submit()" class="space-y-3.5">
          <div>
            <label class="block text-xs font-semibold text-[#a3a8b6] mb-1.5 ml-1" x-text="t('username')"></label>
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#6b7180] pointer-events-none">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.5 20.118a7.5 7.5 0 0115 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.5-1.632z"/>
                </svg>
              </span>
              <input type="text" x-model="username" x-ref="userInput" required autocomplete="username" minlength="3"

        providerIcon() { return this.providerIcons[this.sso.provider] || this.providerIcons.openid; },
        // Lỗi SSO hay gặp -> tiếng Việt (máy chủ trả tiếng Anh; lỗi khác giữ nguyên để dễ tra)
        ssoMsg(m) {
          if (this.lang !== 'vi') return m;
          const rules = [
            [/^(.+) is not in a group allowed to use AppManager \(groups: (.*)\)/, (x) => `${x[1]} không thuộc nhóm nào được dùng AppManager (nhóm: ${x[2]}). Hãy nhờ Quản trị.`],
            [/^An AppManager account named (\S+) already exists/, (x) => `Đã có tài khoản AppManager tên ${x[1]}. Quản trị có thể bật "Gắn tài khoản có sẵn cùng tên" trong cài đặt SSO.`],
            [/^There is no AppManager account for (.+?) \(automatic/, (x) => `Chưa có tài khoản AppManager cho ${x[1]} (đang tắt tự tạo tài khoản). Hãy nhờ Quản trị.`],
            [/^This account is disabled/, () => 'Tài khoản này đã bị khoá. Hãy nhờ Quản trị mở lại.'],
            [/^SSO is turned off/, () => 'SSO đang tắt.'],
            [/^Sign-in expired or was started elsewhere/, () => 'Phiên đăng nhập đã hết hạn hoặc bắt đầu ở tab khác — hãy thử lại.'],
            [/^The provider refused: (.*)/, (x) => `Nhà cung cấp từ chối: ${x[1]}`],
            [/^Cannot connect to (\S+?):/, (x) => `Không kết nối được ${x[1]}: kiểm tra địa chỉ và mạng của AppManager.`],
          ];
          for (const [re, fn] of rules) { const x = m.match(re); if (x) return fn(x); }
          return m;
        },
        _store(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
        _load(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
        initLamp() {
          const c = this._load('amp_lamp_color');
          if (c && this.lampColors[c]) this.color = c;
          // sao lấp lánh
          const box = this.$refs.stars;
          for (let i = 0; i < 46; i++) {
            const d = document.createElement('span'); d.className = 'lp-star';
            d.style.left = (Math.random() * 100) + '%'; d.style.top = (Math.random() * 100) + '%';
            d.style.animationDelay = (Math.random() * 4) + 's';
            if (Math.random() < .25) { d.style.width = d.style.height = '3px'; }
            box.appendChild(d);
          }
          // Có lỗi cần đọc / đang thiết lập lần đầu / đã bật lần trước -> bật đèn luôn (không bắt kéo dây lại)
          const keepOn = this._load('amp_lamp_on') === '1' || !!this.error || this.isSetup;
          this.ready = true;
          if (keepOn) setTimeout(() => this.setLamp(true, false), 250);
          window.addEventListener('resize', () => this.calcBeam());
          // nội dung đổi chiều cao (lỗi, tab Đăng ký, nút SSO…) -> tính lại
          try { new ResizeObserver(() => this.calcBeam()).observe(this.$refs.cardBox); } catch (_) {}
          this.$nextTick(() => this.calcBeam());
        },
        setColor(c) { this.color = c; this._store('amp_lamp_color', c); if (!this.lampOn) this.setLamp(true); },
        setLamp(on, focus = true) {
          this.lampOn = on; this._store('amp_lamp_on', on ? '1' : '0');
          this.$nextTick(() => {
            this.calcBeam();
            if (on && focus && !this.username && window.matchMedia('(pointer: fine)').matches) setTimeout(() => this.$refs.userInput?.focus(), 450);
          });
        },
        toggleLamp() { this.setLamp(!this.lampOn); },
        // Chùm sáng = bao lồi của ống kính máy chiếu + 4 góc ô đăng nhập, sáng nhất ở ống kính
        calcBeam() {
          const A = this.$refs.rimA?.getBoundingClientRect(), Bm = this.$refs.rimB?.getBoundingClientRect();
          const M = this.$refs.mouth?.getBoundingClientRect(), C = this.$refs.cardBox?.getBoundingClientRect();
          if (!A || !Bm || !M || !C) return;
          // toạ độ theo TRANG (cộng phần đã cuộn): chùm sáng nằm trong trang nên cuộn cùng máy chiếu
          const X = window.scrollX, Y = window.scrollY;
          const c = (r) => [r.left + r.width / 2 + X, r.top + r.height / 2 + Y];
          const pts = [c(A), c(Bm), [C.left + X, C.top + Y], [C.right + X, C.top + Y], [C.right + X, C.bottom + Y], [C.left + X, C.bottom + Y]];
          const hull = (P) => {
            P = P.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
            const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
            const lo = [], up = [];
            for (const p of P) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
            for (const p of P.slice().reverse()) { while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
            return lo.slice(0, -1).concat(up.slice(0, -1));
          };
          const [mx, my] = c(M);
          const far = Math.max(...pts.map(p => Math.hypot(p[0] - mx, p[1] - my)));
          this.beam = { points: hull(pts).map(p => p.map(v => v.toFixed(1)).join(',')).join(' '), cx: mx, cy: my, r: far,
                        h: Math.max(document.documentElement.scrollHeight, document.body.scrollHeight) };
        },
        async init() {
          // Lỗi SSO quay về trang đăng nhập dạng ?sso_error=... (máy chủ đã ghi nhật ký)
          const q = new URLSearchParams(location.search).get('sso_error');
          if (q) { this.error = this.t('ssoFailed') + ': ' + this.ssoMsg(q); history.replaceState(null, '', '/login'); }
          this.initLamp();
          if (!this.isSetup) {
            try { const r = await fetch('/api/auth/oidc/status'); if (r.ok) this.sso = await r.json(); } catch (_) {}
            this.$nextTick(() => this.calcBeam());
          }
        },

        t(key) { return (dict[this.lang] || dict.en)[key] || key; },
        toggleLang() {
          this.lang = this.lang === 'vi' ? 'en' : 'vi';
          localStorage.setItem('amp_lang', this.lang);
        },
        // Đang tạo tài khoản Quản trị đầu tiên (máy chưa có tài khoản, tab Đăng ký)
        creating() { return this.isSetup && this.mode === 'signup'; },
        async submit() {
          this.error = '';
          if (this.isSetup && this.mode === 'signin') { this.error = this.t('noAccountYet'); return; }
          if (this.creating() && this.password !== this.confirmPassword) {
            this.error = this.t('mismatch'); return;
          }
          this.loading = true;
          try {
            const url = this.creating() ? '/api/auth/setup' : '/api/auth/login';
            const body = this.creating()
              ? { username: this.username, password: this.password, confirm_password: this.confirmPassword }
              : { username: this.username, password: this.password, remember: this.remember, otp: this.otpStep ? this.otp : null };
            const res = await fetch(url, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });
            const data = await res.json();
            if (!res.ok) throw new Error(res.status === 403 && this.lang === 'vi' && /disabled/.test(data.detail || '') ? 'Tài khoản này đã bị khoá. Hãy nhờ Quản trị mở lại.' : (data.detail || 'Authentication failed'));
            if (data.otp_required) {
              this.otpStep = true;
              this.$nextTick(() => this.$refs.otpInput && this.$refs.otpInput.focus());
              return;
            }
            window.location.href = '/';
          } catch (err) { this.error = err.message; }
          finally { this.loading = false; }
        }
      };
    }
  </script>
