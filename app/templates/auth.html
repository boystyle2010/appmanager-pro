<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1122" id="meta-theme-color" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <title>AppManager Pro — Sign In</title>
  <link rel="icon" type="image/png" href="/assets/icon.png" />
  <link rel="apple-touch-icon" href="/assets/icon.png" />
    <link href="/static/vendor/fonts-auth.css" rel="stylesheet" onerror="this.onerror=null;this.href='https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap'" />
  <!-- Tailwind CSS v4 đã biên dịch sẵn lúc build image; thiếu file thì dùng bản chạy trong trình duyệt -->
  <link rel="stylesheet" href="/static/css/tailwind.css?v={{ build }}"
        onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4';document.head.appendChild(s)" />
  <script defer src="/static/vendor/alpine.min.js"></script>
  <script>window.addEventListener('load',function(){if(!window.Alpine){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/alpinejs@3.17.5/dist/cdn.min.js';document.head.appendChild(s)}});</script>
  <link rel="stylesheet" href="/static/css/glass.css" />
  <script>
    (function () {
      const saved = localStorage.getItem('amp_theme') || 'dark';
      const isLight = saved === 'light';
      document.documentElement.classList.toggle('light', isLight);
      document.documentElement.classList.toggle('dark', !isLight);
      document.getElementById('meta-theme-color').setAttribute('content', isLight ? '#e4eefb' : '#0a1122');
    })();
  </script>
</head>
<body x-data="authApp({{ 'true' if is_setup else 'false' }})">
  <div class="ambient-bg"></div>
  <div class="ambient-grid"></div>

  <div class="page-layer min-h-[100lvh] flex flex-col items-center justify-center px-5 py-10 safe-bottom">
    <!-- Top Right Controls -->
    <div class="fixed right-4 z-20 flex items-center gap-1 p-1 rounded-2xl glass-panel"
         style="top: calc(0.75rem + env(safe-area-inset-top));">
      <button @click="toggleLang()" type="button"
              class="px-2.5 py-1.5 rounded-xl text-xs font-semibold text-muted hover:text-[var(--text-primary)] hover:bg-[var(--glass-surface-hover)] transition">
        <span x-text="lang === 'vi' ? 'VN' : 'EN'"></span>
      </button>
      <div class="w-px h-4 bg-[var(--glass-border)]"></div>
      <button @click="toggleTheme()" type="button" aria-label="Toggle theme"
              class="p-1.5 rounded-xl text-muted hover:text-[var(--text-primary)] hover:bg-[var(--glass-surface-hover)] transition">
        <svg x-show="theme === 'dark'" class="w-4 h-4 text-amber-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/>
        </svg>
        <svg x-show="theme === 'light'" x-cloak class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
      </button>
    </div>

    <div class="w-full max-w-[400px] relative">
      <div class="absolute -inset-1 rounded-[32px] bg-linear-to-br from-sky-500/20 via-indigo-500/15 to-purple-500/20 blur-2xl opacity-70 pointer-events-none"></div>

      <div class="glass-panel relative rounded-[28px] p-7 sm:p-8">
        <div class="flex flex-col items-center text-center mb-7">
          <div class="relative mb-4">
            <div class="absolute -inset-2 rounded-3xl bg-sky-500/30 blur-xl opacity-55"></div>
            <div class="brand-squircle relative w-[68px] h-[68px]">
              <img src="/assets/icon.png" alt="AppManager Pro" />
            </div>
          </div>

          <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-sky-500/15 text-sky-400 border border-sky-400/25 mb-2">
            <span class="w-1.5 h-1.5 rounded-full bg-sky-400"></span>
            <span x-text="isSetup ? t('firstRunBadge') : t('secureBadge')"></span>
          </div>

          <div class="flex items-center justify-center gap-2">
            <h1 class="text-2xl font-bold leading-none tracking-tight">App Manager</h1>
            <span class="pro-badge !h-[22px] !text-[11px] !px-2 !rounded-[6px] !pt-[1px] relative top-[1px]">PRO</span>
          </div>
          <p class="text-xs sm:text-sm text-muted mt-1.5 leading-relaxed max-w-[280px]"
             x-text="isSetup ? t('setupSubtitle') : t('loginSubtitle')"></p>
        </div>

        <div x-show="error" x-cloak x-transition
             class="mb-5 px-3.5 py-3 rounded-2xl bg-rose-500/15 border border-rose-500/35 text-rose-400 text-xs font-medium flex items-start gap-2.5">
          <svg class="w-4 h-4 shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 8v4m0 4h.01"/>
          </svg>
          <span x-text="error"></span>
        </div>

        <form @submit.prevent="submit()" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-muted mb-1.5 ml-1" x-text="t('username')"></label>
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-subtle pointer-events-none">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.5 20.118a7.5 7.5 0 0115 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.5-1.632z"/>
                </svg>
              </span>
              <input type="text" x-model="username" required autocomplete="username" minlength="3"
                     class="glass-input w-full rounded-2xl pl-10 pr-4 py-3 text-sm" placeholder="admin" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-muted mb-1.5 ml-1" x-text="t('password')"></label>
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-subtle pointer-events-none">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                  <rect x="4" y="11" width="16" height="10" rx="2"/><path stroke-linecap="round" d="M8 11V7a4 4 0 118 0v4"/>
                </svg>
              </span>
              <input :type="showPw ? 'text' : 'password'" x-model="password" required
                     :autocomplete="isSetup ? 'new-password' : 'current-password'"
                     :minlength="isSetup ? 8 : 1"
                     class="glass-input w-full rounded-2xl pl-10 pr-11 py-3 text-sm" placeholder="••••••••" />
              <button type="button" @click="showPw = !showPw"
                      class="absolute right-3 top-1/2 -translate-y-1/2 p-1.5 rounded-lg text-subtle hover:text-[var(--text-primary)] transition">
                <svg x-show="!showPw" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg x-show="showPw" x-cloak class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65"/>
                </svg>
              </button>
            </div>
          </div>

          <template x-if="isSetup">
            <div>
              <label class="block text-xs font-semibold text-muted mb-1.5 ml-1" x-text="t('confirmPassword')"></label>
              <input :type="showPw ? 'text' : 'password'" x-model="confirmPassword" required
                     autocomplete="new-password" minlength="8"
                     class="glass-input w-full rounded-2xl px-4 py-3 text-sm" placeholder="••••••••" />
            </div>
          </template>

          <template x-if="otpStep">
            <div>
              <label class="block text-xs font-semibold text-muted mb-1.5 ml-1" x-text="t('otpLabel')"></label>
              <input type="text" x-model="otp" x-ref="otpInput" inputmode="numeric" autocomplete="one-time-code"
                     class="glass-input w-full rounded-2xl px-4 py-3 text-lg tracking-[0.35em] text-center font-semibold" placeholder="123456" />
              <p class="text-[11px] text-subtle mt-1.5 ml-1" x-text="t('otpHint')"></p>
            </div>
          </template>

          <template x-if="!isSetup">
            <label class="flex items-center gap-2.5 text-xs font-medium text-muted cursor-pointer select-none pt-1 ml-1">
              <input type="checkbox" x-model="remember" class="w-4 h-4 rounded accent-sky-500" />
              <span x-text="t('remember')"></span>
            </label>
          </template>

          <button type="submit" :disabled="loading"
                  class="glass-btn-primary w-full rounded-2xl py-3.5 text-sm font-semibold mt-2 flex items-center justify-center gap-2 disabled:opacity-60">
            <span x-text="loading ? t('processing') : (isSetup ? t('createAdmin') : (otpStep ? t('verify') : t('signIn')))"></span>
          </button>
        </form>

        <div class="mt-6 pt-4 border-t border-[var(--glass-border)] flex items-center justify-between text-[11px] text-subtle">
          <span>Argon2id Protected</span>
          <span>v{{ version }}</span>
        </div>
      </div>
      <p class="mt-4 text-center text-[11px] text-subtle">
        © 2026 <a href="https://github.com/boystyle2010" target="_blank" rel="noopener" class="hover:text-[var(--text-primary)]">boystyle2010</a>
        · <a href="https://github.com/boystyle2010/appmanager-pro/blob/main/LICENSE" target="_blank" rel="noopener" class="hover:text-[var(--text-primary)]">MIT License</a>
      </p>
    </div>
  </div>

  <script>
    function authApp(isSetup) {
      const dict = {
        en: {
          firstRunBadge: 'First-Time Setup', secureBadge: 'Docker Control Center',
          setupSubtitle: 'Create an administrator account to protect your Docker engine',
          loginSubtitle: 'Sign in to manage containers, compose files & updates',
          username: 'Username', password: 'Password', confirmPassword: 'Confirm Password',
          remember: 'Keep me signed in for 30 days', createAdmin: 'Create Admin Account',
          signIn: 'Sign In', processing: 'Authenticating...', mismatch: 'Passwords do not match',
          otpLabel: 'Two-factor code', otpHint: '6-digit code from your authenticator app, or a backup code', verify: 'Verify'
        },
        vi: {
          firstRunBadge: 'Thiết lập lần đầu', secureBadge: 'Trung tâm điều khiển Docker',
          setupSubtitle: 'Tạo tài khoản Quản trị viên để bảo vệ quyền truy cập Docker',
          loginSubtitle: 'Đăng nhập để quản lý ứng dụng, Compose và cập nhật',
          username: 'Tên đăng nhập', password: 'Mật khẩu', confirmPassword: 'Xác nhận mật khẩu',
          remember: 'Ghi nhớ đăng nhập trong 30 ngày', createAdmin: 'Tạo tài khoản Admin',
          signIn: 'Đăng nhập', processing: 'Đang xác thực...', mismatch: 'Mật khẩu xác nhận không khớp',
          otpLabel: 'Mã xác thực 2 lớp', otpHint: 'Mã 6 số trong ứng dụng xác thực, hoặc mã dự phòng', verify: 'Xác minh'
        }
      };

      return {
        isSetup, lang: localStorage.getItem('amp_lang') || 'vi',
        theme: localStorage.getItem('amp_theme') || 'dark',
        username: '', password: '', confirmPassword: '', remember: true,
        showPw: false, loading: false, error: '', otpStep: false, otp: '',

        t(key) { return (dict[this.lang] || dict.en)[key] || key; },
        toggleLang() {
          this.lang = this.lang === 'vi' ? 'en' : 'vi';
          localStorage.setItem('amp_lang', this.lang);
        },
        toggleTheme() {
          this.theme = this.theme === 'dark' ? 'light' : 'dark';
          localStorage.setItem('amp_theme', this.theme);
          const isLight = this.theme === 'light';
          document.documentElement.classList.toggle('light', isLight);
          document.documentElement.classList.toggle('dark', !isLight);
          document.getElementById('meta-theme-color').setAttribute('content', isLight ? '#e4eefb' : '#0a1122');
        },
        async submit() {
          this.error = '';
          if (this.isSetup && this.password !== this.confirmPassword) {
            this.error = this.t('mismatch'); return;
          }
          this.loading = true;
          try {
            const url = this.isSetup ? '/api/auth/setup' : '/api/auth/login';
            const body = this.isSetup
              ? { username: this.username, password: this.password, confirm_password: this.confirmPassword }
              : { username: this.username, password: this.password, remember: this.remember, otp: this.otpStep ? this.otp : null };
            const res = await fetch(url, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Authentication failed');
            if (data.otp_required) {
              this.otpStep = true;
              this.$nextTick(() => this.$refs.otpInput && this.$refs.otpInput.focus());
              return;
            }
            window.location.href = '/';
          } catch (err) { this.error = err.message; }
          finally { this.loading = false; }
        }
      };
    }
  </script>
</body>
</html>
