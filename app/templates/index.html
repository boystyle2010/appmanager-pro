<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#090f1d" id="meta-theme-color" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <title>AppManager Pro</title>
  <link rel="icon" type="image/png" href="/assets/icon.png" />
  <link rel="apple-touch-icon" href="/assets/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.6/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.3/dist/purify.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/css/glass.css" />
  <script>
    (function () {
      const saved = localStorage.getItem('amp_theme') || 'dark';
      const isLight = saved === 'light';
      document.documentElement.classList.toggle('light', isLight);
      document.documentElement.classList.toggle('dark', !isLight);
      document.getElementById('meta-theme-color').setAttribute('content', isLight ? '#e5eef9' : '#090f1d');
    })();
  </script>
</head>
<body x-data="dashboardApp()" x-init="init()" @keydown.window="handleShortcut($event)">
  <div class="ambient-bg"></div>

  <div class="page-layer safe-bottom">
    <!-- Slim Sticky Glass Header -->
    <header class="glass-header sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-4 h-[60px] flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="brand-squircle w-9 h-9 shrink-0">
            <img src="/assets/icon.png" alt="AppManager Pro" />
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <h1 class="font-bold text-[15px] leading-[1.3] tracking-tight truncate">App Manager</h1>
              <span class="pro-badge">PRO</span>
            </div>
            <p class="text-[11px] text-muted flex items-center gap-1.5 leading-tight mt-0.5 tabular-nums">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_6px_#34d399] shrink-0"></span>
              <span x-text="`${summary.running}/${summary.total} ${t('running')}`"></span>
              <span x-show="lastChecked" class="hidden sm:inline text-subtle" x-text="`• ${formatRelativeTime(lastChecked)}`"></span>
            </p>
          </div>
        </div>

        <div class="hidden md:block flex-1 max-w-md mx-3">
          <div class="relative">
            <svg class="w-4 h-4 text-subtle absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="M20 20l-3.5-3.5"/>
            </svg>
            <input x-ref="searchInput" type="text" x-model="search" :placeholder="t('searchPlaceholder')"
                   class="glass-input w-full rounded-2xl pl-10 pr-10 py-2 text-xs" />
            <kbd class="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] font-mono-code px-1.5 py-0.5 rounded-md bg-[var(--glass-surface)] border border-[var(--glass-border)] text-subtle">/</kbd>
          </div>
        </div>

        <div class="flex items-center gap-2 shrink-0">
          <button @click="checkUpdates(false)" :disabled="checkingUpdates"
                  class="glass-btn h-9 px-3 rounded-xl text-xs font-semibold inline-flex items-center gap-1.5 text-sky-400 border-sky-400/25 disabled:opacity-70">
            <svg class="w-3.5 h-3.5" :class="checkingUpdates ? 'animate-spin' : ''" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5M20 20v-5h-5M20.49 9A9 9 0 005.64 5.64L4 9m16 6l-1.64 3.36A9 9 0 013.51 15"/>
            </svg>
            <span x-text="checkingUpdates ? t('checkingShort') : t('checkShort')"></span>
          </button>

          <div class="glass-dock h-9 rounded-xl flex items-center overflow-hidden divide-x divide-[var(--glass-border)]">
            <button @click="openSettings()" :title="t('settings')"
                    class="w-9 h-full flex items-center justify-center text-muted hover:text-[var(--text-primary)] hover:bg-[var(--glass-surface-hover)] transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.343 3.94c.09-.542.56-.94 1.11-.94h1.093c.55 0 1.02.398 1.11.94l.149.894c.07.424.384.764.78.93.398.164.855.142 1.205-.108l.737-.527a1.125 1.125 0 011.45.12l.773.774c.39.389.44 1.002.12 1.45l-.527.737c-.25.35-.272.806-.107 1.204.165.397.505.71.93.78l.893.15c.543.09.94.56.94 1.109v1.094c0 .55-.397 1.02-.94 1.11l-.893.149c-.425.07-.765.383-.93.78-.165.398-.143.854.107 1.204l.527.738c.32.447.269 1.06-.12 1.45l-.774.773a1.125 1.125 0 01-1.449.12l-.738-.527c-.35-.25-.806-.272-1.203-.107-.397.165-.71.505-.781.929l-.149.894c-.09.542-.56.94-1.11.94h-1.094c-.55 0-1.019-.398-1.11-.94l-.148-.894c-.071-.424-.384-.764-.781-.93-.398-.164-.854-.142-1.204.108l-.738.527c-.447.32-1.06.269-1.45-.12l-.773-.774a1.125 1.125 0 01-.12-1.45l.527-.737c.25-.35.273-.806.108-1.204-.165-.397-.505-.71-.93-.78l-.894-.15c-.542-.09-.94-.56-.94-1.109v-1.094c0-.55.398-1.02.94-1.11l.894-.149c.424-.07.765-.383.93-.78.165-.398.143-.854-.107-1.204l-.527-.738a1.125 1.125 0 01.12-1.45l.773-.773a1.125 1.125 0 011.45-.12l.737.527c.35.25.807.272 1.204.107.397-.165.71-.505.78-.929l.15-.894z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
            <button @click="logout()" :title="t('logout')"
                    class="w-9 h-full flex items-center justify-center text-rose-400/90 hover:text-rose-400 hover:bg-rose-500/10 transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 pt-4">
      <!-- Dismissible Update Notification Banner + Update All -->
      <div x-show="showUpdateBanner" x-cloak x-transition
           class="glass-panel rounded-[22px] p-4 mb-4 border-amber-400/35 bg-gradient-to-r from-amber-500/12 via-orange-500/8 to-transparent flex flex-col sm:flex-row sm:items-center justify-between gap-3.5 relative">
        <div class="flex items-start sm:items-center justify-between gap-3 min-w-0 flex-1">
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-10 h-10 rounded-2xl bg-amber-500/20 border border-amber-400/35 flex items-center justify-center text-amber-400 shrink-0">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/>
              </svg>
            </div>
            <div class="min-w-0">
              <p class="text-sm font-semibold text-amber-300 leading-snug"
                 x-text="`${summary.updates} ${t('updatesAvailable')}`"></p>
              <p class="text-[11px] text-muted mt-0.5" x-show="lastChecked"
                 x-text="`${t('lastChecked')}: ${formatRelativeTime(lastChecked)}`"></p>
            </div>
          </div>

          <!-- Nút tắt Banner trên Mobile -->
          <button @click="dismissUpdateBanner()" :title="t('dismissBanner')" aria-label="Dismiss"
                  class="sm:hidden glass-btn w-7 h-7 rounded-full flex items-center justify-center text-muted hover:text-[var(--text-primary)] shrink-0">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <div class="grid grid-cols-2 sm:flex items-center gap-2 shrink-0">
          <button @click="filter = (filter === 'updates' ? 'all' : 'updates')"
                  class="glass-btn h-9 px-3.5 rounded-xl text-xs font-semibold inline-flex items-center justify-center gap-1.5">
            <span x-text="filter === 'updates' ? t('showAll') : t('viewUpdates')"></span>
          </button>
          <button @click="confirmBatchUpdate()"
                  class="glass-btn-update h-9 px-4 rounded-xl text-xs font-semibold inline-flex items-center justify-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/>
            </svg>
            <span x-text="`${t('updateAll')} (${summary.updates})`"></span>
          </button>
          <!-- Nút tắt Banner trên Desktop -->
          <button @click="dismissUpdateBanner()" :title="t('dismissBanner')" aria-label="Dismiss"
                  class="hidden sm:flex glass-btn w-8 h-8 rounded-full items-center justify-center text-muted hover:text-[var(--text-primary)] shrink-0 ml-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Mobile Search -->
      <div class="md:hidden mb-3">
        <div class="relative">
          <svg class="w-4 h-4 text-subtle absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="M20 20l-3.5-3.5"/>
          </svg>
          <input type="text" x-model="search" :placeholder="t('searchPlaceholder')"
                 class="glass-input w-full rounded-2xl pl-10 pr-10 py-2.5 text-sm" />
          <button x-show="search" x-cloak @click="search = ''" aria-label="Clear search"
                  class="absolute right-2.5 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full flex items-center justify-center text-subtle hover:text-[var(--text-primary)]">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Filter Pills -->
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1 mb-4">
        <template x-for="tab in filterTabs" :key="tab.id">
          <button @click="filter = tab.id"
                  class="shrink-0 inline-flex items-center gap-1.5 px-3.5 py-2 rounded-2xl text-xs font-semibold transition-all"
                  :class="filter === tab.id
                    ? (tab.id === 'updates' ? 'glass-btn-update' : 'glass-btn-primary')
                    : 'glass-btn text-muted'">
            <span x-text="t(tab.labelKey)"></span>
            <span class="px-1.5 py-0.5 rounded-full text-[10px] leading-none"
                  :class="filter === tab.id
                    ? 'bg-white/25 text-white'
                    : (tab.id === 'updates' && summary.updates > 0 ? 'bg-amber-500/25 text-amber-300' : 'bg-[var(--glass-surface)] text-subtle')"
                  x-text="countForTab(tab.id)"></span>
          </button>
        </template>
      </div>

      <!-- Error Banner -->
      <div x-show="error" x-cloak
           class="glass-panel rounded-2xl p-3.5 mb-4 border-rose-500/40 bg-rose-500/15 text-xs text-rose-400 flex items-center justify-between gap-3">
        <span x-text="error"></span>
        <button @click="error = ''" class="glass-btn px-2.5 py-1 rounded-lg text-xs">OK</button>
      </div>

      <!-- App Grid -->
      <div x-show="filteredApps.length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3.5">
        <template x-for="app in filteredApps" :key="app.full_id">
          <div class="glass-card rounded-[22px] p-4 flex flex-col justify-between gap-3"
               :class="app.has_update ? 'glass-card-update' : ''">

            <div @click="openUpdateModal(app)" class="cursor-pointer group space-y-3">
              <div class="flex items-center gap-3">
                <template x-if="app.icon">
                  <div class="w-11 h-11 rounded-[14px] shrink-0 overflow-hidden flex items-center justify-center shadow-sm"
                       :class="app.is_self ? 'brand-squircle' : 'glass-icon-box p-1.5'">
                    <img :src="app.icon" :alt="app.title"
                         :class="app.is_self ? '' : 'w-full h-full object-contain rounded-lg'"
                         @error="app.icon = ''" />
                  </div>
                </template>
                <template x-if="!app.icon">
                  <div class="w-11 h-11 rounded-[14px] shrink-0 flex items-center justify-center text-white font-bold text-xs uppercase shadow-sm ring-1 ring-white/20"
                       :class="avatarGradient(app.title)" x-text="app.title.slice(0, 2)"></div>
                </template>

                <div class="min-w-0 flex-1">
                  <div class="flex items-center justify-between gap-2">
                    <h2 class="font-semibold text-[15px] leading-tight truncate group-hover:text-sky-400 transition"
                        :title="app.title" x-text="app.title"></h2>
                    <span class="text-[9px] px-1.5 py-0.5 rounded-md font-semibold uppercase tracking-wider shrink-0 border"
                          :class="app.source === 'casaos'
                            ? 'bg-indigo-500/12 text-indigo-300 border-indigo-400/20'
                            : 'bg-sky-500/12 text-sky-300 border-sky-400/20'"
                          x-text="app.source"></span>
                  </div>

                  <div class="flex items-center gap-1.5 mt-1 text-[11px] font-medium">
                    <span class="w-1.5 h-1.5 rounded-full shrink-0"
                          :class="app.status === 'running' ? 'bg-emerald-400 shadow-[0_0_6px_#34d399]' : 'bg-slate-500'"></span>
                    <span :class="app.status === 'running' ? 'text-emerald-400' : 'text-subtle'"
                          x-text="app.status === 'running' ? t('statusRunning') : app.status"></span>
                    <span x-show="app.uptime" class="text-subtle">•</span>
                    <span x-show="app.uptime" class="text-muted truncate" x-text="app.uptime"></span>
                    <span x-show="app.auto_update"
                          class="ml-auto text-[9px] px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-400 border border-emerald-400/25 font-semibold">AUTO</span>
                  </div>
                </div>
              </div>

              <div class="glass-inset rounded-2xl px-3 py-2.5 space-y-1.5">
                <div class="flex items-center justify-between gap-2 text-[11px]">
                  <template x-if="app.has_update">
                    <div class="flex items-center gap-1.5 min-w-0 flex-1">
                      <span class="font-mono-code text-muted truncate" x-text="app.version"></span>
                      <svg class="w-3 h-3 text-amber-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/>
                      </svg>
                      <span class="font-mono-code font-semibold px-1.5 py-0.5 rounded-md bg-amber-500/20 text-amber-300 truncate"
                            x-text="app.remote_version || t('newBuild')"></span>
                    </div>
                  </template>

                  <template x-if="!app.has_update">
                    <div class="flex items-center justify-between gap-2 min-w-0 flex-1">
                      <span class="font-mono-code font-medium text-sky-400 truncate" x-text="app.version"></span>
                      <span x-show="app.is_skipped"
                            class="text-[10px] px-1.5 py-0.5 rounded bg-slate-500/20 text-muted shrink-0"
                            x-text="t('skippedBadge')"></span>
                      <span x-show="!app.is_skipped && app.checked_at && !app.update_error"
                            class="inline-flex items-center gap-1 text-[10px] font-semibold text-emerald-400/90 shrink-0">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
                        </svg>
                        <span x-text="t('upToDate')"></span>
                      </span>
                      <span x-show="!app.checked_at" class="text-[10px] text-subtle italic shrink-0" x-text="t('notChecked')"></span>
                      <span x-show="app.checked_at && app.update_error && !app.is_skipped"
                            class="text-[10px] text-subtle truncate max-w-[45%]" :title="app.update_error" x-text="app.update_error"></span>
                    </div>
                  </template>

                  <svg class="w-3.5 h-3.5 text-subtle shrink-0 group-hover:translate-x-0.5 group-hover:text-sky-400 transition"
                       fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/>
                  </svg>
                </div>

                <p class="font-mono-code text-[10.5px] text-subtle truncate" :title="app.image" x-text="shortImage(app.image)"></p>
              </div>
            </div>

            <div class="flex items-center gap-2 pt-0.5">
              <template x-if="app.has_update">
                <button @click="openUpdateModal(app)"
                        class="glass-btn-update flex-1 h-9 px-3.5 rounded-xl text-xs font-semibold inline-flex items-center justify-center gap-1.5">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/>
                  </svg>
                  <span x-text="t('updateNow')"></span>
                </button>
              </template>

              <template x-if="!app.has_update && app.port_map && app.status === 'running'">
                <a :href="buildWebUrl(app)" target="_blank" rel="noopener"
                   class="glass-btn-primary flex-1 h-9 px-3.5 rounded-xl text-xs font-semibold inline-flex items-center justify-center gap-1.5">
                  <span x-text="t('open')"></span>
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"/>
                  </svg>
                </a>
              </template>

              <template x-if="!app.has_update && (!app.port_map || app.status !== 'running')">
                <button @click="app.status === 'running' ? openLogs(app) : runAction(app, 'start')"
                        :disabled="busyId === app.id"
                        class="flex-1 h-9 px-3.5 rounded-xl text-xs font-semibold inline-flex items-center justify-center gap-1.5 disabled:opacity-50"
                        :class="app.status === 'running' ? 'glass-btn text-sky-400' : 'glass-btn-primary'">
                  <svg x-show="app.status !== 'running'" class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg>
                  <svg x-show="app.status === 'running'" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 7.5l3 2.25-3 2.25m4.5 0h3M4.5 19.5h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5z"/>
                  </svg>
                  <span x-text="app.status === 'running' ? t('logs') : t('start')"></span>
                </button>
              </template>

              <button @click="openActionSheet(app)" :aria-label="t('moreActions')"
                      class="glass-btn w-10 h-9 rounded-xl flex items-center justify-center text-muted hover:text-[var(--text-primary)] shrink-0">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                  <circle cx="5" cy="12" r="1.75"/><circle cx="12" cy="12" r="1.75"/><circle cx="19" cy="12" r="1.75"/>
                </svg>
              </button>
            </div>
          </div>
        </template>
      </div>

      <div x-show="!loading && filteredApps.length === 0" x-cloak
           class="glass-panel rounded-[22px] p-12 text-center text-sm text-muted"
           x-text="t('noApps')"></div>
    </main>
  </div>

  <!-- iOS GROUPED GLASS ACTION SHEET -->
  <div x-show="actionSheet.open" x-cloak x-transition.opacity
       class="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4 bg-black/60 backdrop-blur-sm"
       @click.self="closeActionSheet()" @keydown.escape.window="closeActionSheet()">
    <div class="glass-panel w-full max-w-sm rounded-t-[28px] sm:rounded-[28px] p-5 space-y-3.5"
         style="padding-bottom: calc(1.25rem + env(safe-area-inset-bottom));">
      <div class="sheet-handle sm:hidden"></div>

      <div class="flex items-center gap-3 pb-1" x-show="actionSheet.app">
        <template x-if="actionSheet.app?.icon">
          <div class="w-10 h-10 rounded-xl shrink-0 overflow-hidden flex items-center justify-center"
               :class="actionSheet.app.is_self ? 'brand-squircle' : 'glass-icon-box p-1'">
            <img :src="actionSheet.app.icon" class="w-full h-full object-contain rounded-lg" />
          </div>
        </template>
        <div class="min-w-0 flex-1">
          <h3 class="font-bold text-sm truncate" x-text="actionSheet.app?.title"></h3>
          <p class="text-[11px] text-muted font-mono-code truncate" x-text="actionSheet.app?.name"></p>
        </div>
        <button @click="closeActionSheet()" aria-label="Close"
                class="glass-btn w-8 h-8 rounded-full flex items-center justify-center text-muted hover:text-[var(--text-primary)] shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="ios-group text-xs font-semibold">
        <a x-show="actionSheet.app?.port_map && actionSheet.app?.status === 'running'"
           :href="actionSheet.app ? buildWebUrl(actionSheet.app) : '#'" target="_blank" rel="noopener"
           @click="closeActionSheet()" class="ios-row text-sky-400">
          <span class="flex items-center gap-3">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"/>
            </svg>
            <span x-text="t('open')"></span>
          </span>
          <svg class="w-3.5 h-3.5 text-subtle" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
        </a>

        <button @click="const a = actionSheet.app; closeActionSheet(); openUpdateModal(a)" class="ios-row">
          <span class="flex items-center gap-3">
            <svg class="w-4 h-4 text-amber-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/>
            </svg>
            <span x-text="t('updateAndChangelog')"></span>
          </span>
          <span x-show="actionSheet.app?.has_update" class="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300">NEW</span>
        </button>

        <button x-show="actionSheet.app?.can_update"
                @click="const a = actionSheet.app; closeActionSheet(); openEditModal(a)" class="ios-row">
          <span class="flex items-center gap-3">
            <svg class="w-4 h-4 text-indigo-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931z"/>
            </svg>
            <span x-text="t('editCompose')"></span>
          </span>
          <svg class="w-3.5 h-3.5 text-subtle" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
        </button>

        <button @click="const a = actionSheet.app; closeActionSheet(); openLogs(a)" class="ios-row">
          <span class="flex items-center gap-3">
            <svg class="w-4 h-4 text-emerald-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 7.5l3 2.25-3 2.25m4.5 0h3M4.5 19.5h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5z"/>
            </svg>
            <span x-text="t('liveLogs')"></span>
          </span>
          <svg class="w-3.5 h-3.5 text-subtle" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
        </button>
      </div>

      <!-- Power Controls (Đều có bảng xác nhận trước khi Restart / Stop) -->
      <div class="grid grid-cols-2 gap-2 text-xs font-semibold">
        <button @click="const a = actionSheet.app; closeActionSheet(); confirmRestart(a)"
                class="glass-btn py-2.5 px-3 rounded-2xl flex items-center justify-center gap-2 text-sky-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5M20 20v-5h-5M20.49 9A9 9 0 005.64 5.64L4 9m16 6l-1.64 3.36A9 9 0 013.51 15"/>
          </svg>
          <span x-text="t('restart')"></span>
        </button>

        <button @click="const a = actionSheet.app; closeActionSheet(); a.status === 'running' ? confirmStop(a) : runAction(a, 'start')"
                class="glass-btn py-2.5 px-3 rounded-2xl flex items-center justify-center gap-2 transition"
                :class="actionSheet.app?.status === 'running' ? 'text-amber-400' : 'text-emerald-400'">
          <svg x-show="actionSheet.app?.status === 'running'" class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
          <svg x-show="actionSheet.app?.status !== 'running'" class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg>
          <span x-text="actionSheet.app?.status === 'running' ? t('stop') : t('start')"></span>
        </button>
      </div>

      <button x-show="!actionSheet.app?.is_self"
              @click="const a = actionSheet.app; closeActionSheet(); openUninstallModal(a)"
              class="w-full py-3 rounded-2xl text-xs font-semibold flex items-center justify-center gap-2 bg-rose-500/12 border border-rose-500/30 text-rose-400 hover:bg-rose-500/20 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/>
        </svg>
        <span x-text="t('uninstallApp')"></span>
      </button>
    </div>
  </div>

  <!-- MODAL 1: Batch Update All -->
  <div x-show="batchModal.open" x-cloak x-transition.opacity
       class="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4 bg-black/65 backdrop-blur-md"
       @click.self="closeBatchModal()">
    <div class="glass-panel w-full max-w-2xl rounded-t-[28px] sm:rounded-[28px] p-5 sm:p-6 flex flex-col max-h-[90dvh]"
         style="padding-bottom: calc(1.25rem + env(safe-area-inset-bottom));">
      <div class="sheet-handle sm:hidden"></div>
      <div class="flex items-center justify-between gap-3 pb-3.5 border-b border-[var(--glass-border)]">
        <div>
          <h3 class="font-bold text-base" x-text="t('batchTitle')"></h3>
          <p class="text-xs text-muted mt-0.5"
             x-text="batchModal.running
               ? `${batchModal.doneCount}/${batchModal.items.length} ${t('batchProgress')}`
               : `${batchModal.succeeded} ${t('batchDone')} • ${batchModal.failed} ${t('batchFailed')}`"></p>
        </div>
        <button @click="closeBatchModal()" :disabled="batchModal.running" aria-label="Close"
                class="glass-btn w-8 h-8 rounded-full flex items-center justify-center text-muted hover:text-[var(--text-primary)] disabled:opacity-40 shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="mt-4 h-2 rounded-full bg-[var(--glass-surface)] overflow-hidden">
        <div class="h-full rounded-full bg-gradient-to-r from-sky-400 to-indigo-500 transition-all duration-300"
             :style="`width: ${batchModal.items.length ? Math.round((batchModal.doneCount / batchModal.items.length) * 100) : 0}%`"></div>
      </div>
      <div class="flex-1 overflow-y-auto py-4 space-y-3">
        <div class="space-y-2">
          <template x-for="item in batchModal.items" :key="item.name">
            <div class="glass-inset rounded-2xl px-3.5 py-2.5 flex items-center justify-between gap-3 text-xs">
              <div class="flex items-center gap-2.5 min-w-0">
                <template x-if="item.icon"><img :src="item.icon" class="w-7 h-7 rounded-lg object-contain shrink-0" /></template>
                <div class="min-w-0">
                  <p class="font-semibold truncate" x-text="item.title"></p>
                  <p class="font-mono-code text-[10.5px] text-muted truncate" x-text="`${item.from_version} → ${item.to_version}`"></p>
                </div>
              </div>
              <span class="text-[11px] font-semibold shrink-0"
                    :class="{'text-subtle': item.status === 'pending', 'text-sky-400': item.status === 'running', 'text-emerald-400': item.status === 'success', 'text-rose-400': item.status === 'failed'}">
                <span x-show="item.status === 'pending'" x-text="t('statusPending')"></span>
                <span x-show="item.status === 'running'" x-text="t('statusUpdating')"></span>
                <span x-show="item.status === 'success'">✓ OK</span>
                <span x-show="item.status === 'failed'">✕ Error</span>
              </span>
            </div>
          </template>
        </div>
        <pre x-ref="batchLogBox"
             class="glass-terminal font-mono-code rounded-2xl p-3.5 h-52 overflow-auto text-[11px] text-emerald-300/95 leading-relaxed whitespace-pre-wrap break-all"
             x-text="batchModal.logs || t('connectingLogs')"></pre>
      </div>
      <div class="pt-3 border-t border-[var(--glass-border)]">
        <button @click="closeBatchModal()" :disabled="batchModal.running"
                class="glass-btn-primary w-full py-3 rounded-2xl text-xs font-semibold disabled:opacity-50"
                x-text="batchModal.running ? t('updatingWait') : t('close')"></button>
      </div>
    </div>
  </div>

  <!-- MODAL 2: Update Details + Changelog + Skip Update -->
  <div x-show="updateModal.open" x-cloak x-transition.opacity
       class="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4 bg-black/65 backdrop-blur-md"
       @click.self="closeUpdateModal()" @keydown.escape.window="if (!confirmModal.open) closeUpdateModal()">
    <div class="glass-panel w-full max-w-2xl rounded-t-[28px] sm:rounded-[28px] p-5 sm:p-6 flex flex-col max-h-[90dvh]"
         style="padding-bottom: calc(1.25rem + env(safe-area-inset-bottom));">
      <div class="sheet-handle sm:hidden"></div>

      <div class="flex items-start justify-between gap-3 pb-4 border-b border-[var(--glass-border)]">
        <div class="flex items-center gap-3.5 min-w-0">
          <template x-if="updateModal.app && updateModal.app.icon">
            <div class="w-12 h-12 rounded-2xl shrink-0 overflow-hidden flex items-center justify-center shadow-md"
                 :class="updateModal.app.is_self ? 'brand-squircle' : 'glass-icon-box p-1.5'">
              <img :src="updateModal.app.icon" class="w-full h-full object-contain rounded-xl" />
            </div>
          </template>
          <template x-if="updateModal.app && !updateModal.app.icon">
            <div class="w-12 h-12 rounded-2xl shrink-0 flex items-center justify-center text-white font-bold text-base uppercase"
                 :class="avatarGradient(updateModal.app.title)" x-text="updateModal.app.title.slice(0, 2)"></div>
          </template>

          <div class="min-w-0">
            <h3 class="font-bold text-base sm:text-lg truncate" x-text="updateModal.app?.title"></h3>
            <p class="text-[11px] text-muted font-mono-code truncate" x-text="updateModal.app?.image"></p>
            <div class="flex items-center gap-1.5 mt-1.5 flex-wrap">
              <span class="font-mono-code text-[11px] px-2 py-0.5 rounded-lg bg-sky-500/15 text-sky-400 border border-sky-400/25"
                    x-text="updateModal.app?.version"></span>
              <span class="text-subtle text-xs">→</span>
              <span class="font-mono-code text-[11px] px-2 py-0.5 rounded-lg border font-semibold"
                    :class="updateModal.app?.raw_has_update
                      ? 'bg-amber-500/20 text-amber-300 border-amber-400/40'
                      : 'bg-emerald-500/15 text-emerald-400 border-emerald-400/30'"
                    x-text="updateModal.app?.remote_version || updateModal.app?.version"></span>
            </div>
          </div>
        </div>

        <button @click="closeUpdateModal()" aria-label="Close"
                class="glass-btn w-8 h-8 rounded-full flex items-center justify-center text-muted hover:text-[var(--text-primary)] shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto py-4 space-y-3.5">
        <div x-show="updateModal.loading" class="py-10 text-center text-xs text-muted" x-text="t('loadingDetails')"></div>

        <template x-if="!updateModal.loading && !updateModal.updating && !updateModal.updateLogs">
          <div class="space-y-3.5">
            <div x-show="updateModal.app?.target_tag"
                 class="rounded-2xl px-3.5 py-2.5 bg-amber-500/12 border border-amber-400/30 text-[11px] text-amber-300 flex items-center gap-2">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z"/>
              </svg>
              <span x-text="lang === 'vi'
                ? `App đang ghim tag cứng — khi cập nhật sẽ tự nâng tag trong docker-compose.yml lên ${updateModal.app?.target_tag} (có sao lưu tự động).`
                : `Pinned tag detected — updating will bump docker-compose.yml to ${updateModal.app?.target_tag} (with automatic backup).`"></span>
            </div>

            <div class="glass-inset rounded-2xl p-3.5 flex items-center justify-between gap-3">
              <div class="min-w-0">
                <p class="text-xs font-semibold" x-text="t('autoUpdateApp')"></p>
                <p class="text-[11px] text-muted" x-text="t('autoUpdateAppDesc')"></p>
              </div>
              <label class="inline-flex items-center cursor-pointer shrink-0">
                <input type="checkbox" x-model="updateModal.autoUpdate" @change="saveAppPref()" class="sr-only peer" />
                <div class="w-11 h-6 bg-slate-600/60 rounded-full peer peer-checked:bg-emerald-500 relative transition after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-5"></div>
              </label>
            </div>

            <div class="glass-inset rounded-2xl p-4 space-y-3">
              <div class="flex items-center justify-between gap-2 flex-wrap">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-bold uppercase tracking-wider text-sky-400">Changelog</span>
                  <span x-show="updateModal.releaseTag"
                        class="text-[11px] font-mono-code px-2 py-0.5 rounded-md bg-white/10 text-muted"
                        x-text="updateModal.releaseTag"></span>
                </div>
                <div class="flex items-center gap-1.5">
                  <a x-show="updateModal.releaseUrl" :href="updateModal.releaseUrl" target="_blank" rel="noopener"
                     class="glass-btn px-2.5 py-1 rounded-lg text-[11px] text-sky-400">GitHub ↗</a>
                  <button @click="updateModal.showRepoInput = !updateModal.showRepoInput"
                          class="glass-btn px-2.5 py-1 rounded-lg text-[11px] text-muted" x-text="t('repoSource')"></button>
                  <button @click="refreshSingleApp()" class="glass-btn px-2.5 py-1 rounded-lg text-[11px]" x-text="t('recheck')"></button>
                </div>
              </div>

              <div x-show="updateModal.changelogError && !updateModal.changelogHtml" x-cloak
                   class="rounded-xl px-3 py-2 bg-rose-500/12 border border-rose-500/30 text-[11px] text-rose-300"
                   x-text="updateModal.changelogError"></div>

              <div x-show="!updateModal.changelogHtml || updateModal.showRepoInput" x-cloak class="space-y-2">
                <p x-show="!updateModal.changelogHtml" class="text-xs text-muted" x-text="t('noChangelog')"></p>
                <div class="flex gap-2">
                  <input type="text" x-model="updateModal.customRepo" placeholder="owner/repo hoặc https://github.com/owner/repo"
                         class="glass-input flex-1 rounded-xl px-3 py-2 text-xs font-mono-code" />
                  <button @click="saveCustomRepo()" class="glass-btn-primary px-3.5 py-2 rounded-xl text-xs font-semibold shrink-0" x-text="t('save')"></button>
                </div>
              </div>

              <div x-show="updateModal.changelogHtml" class="changelog-md" x-html="updateModal.changelogHtml"></div>
            </div>
          </div>
        </template>

        <pre x-show="updateModal.updating || updateModal.updateLogs" x-ref="updateLogBox"
             class="glass-terminal font-mono-code rounded-2xl p-4 h-72 overflow-auto text-[11px] text-emerald-300 leading-relaxed whitespace-pre-wrap break-all"
             x-text="updateModal.updateLogs"></pre>
      </div>

      <div class="pt-3 border-t border-[var(--glass-border)] flex items-center gap-2">
        <button x-show="!updateModal.updating && updateModal.app?.raw_has_update && updateModal.app?.skip_token"
                @click="toggleSkipUpdate()"
                class="glass-btn py-3 px-3.5 rounded-2xl text-xs font-semibold shrink-0"
                :class="updateModal.app?.is_skipped ? 'text-sky-400' : 'text-muted'"
                x-text="updateModal.app?.is_skipped ? t('unskipVersion') : t('skipVersion')"></button>

        <button x-show="!updateModal.updating && updateModal.app?.can_update"
                @click="confirmAppUpdate()"
                class="flex-1 py-3 px-4 rounded-2xl text-xs sm:text-sm font-semibold inline-flex items-center justify-center gap-2"
                :class="updateModal.app?.raw_has_update ? 'glass-btn-update' : 'glass-btn-primary'">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/>
          </svg>
          <span x-text="updateModal.app?.raw_has_update ? t('updateNow') : t('forcePull')"></span>
        </button>

        <div x-show="!updateModal.app?.can_update" class="text-xs text-amber-400" x-text="t('noComposeWarning')"></div>

        <button x-show="updateModal.updating" disabled
                class="glass-btn flex-1 py-3 px-4 rounded-2xl text-xs font-semibold opacity-75"
                x-text="t('updatingWait')"></button>
      </div>
    </div>
  </div>

  <!-- MODAL 3: VISUAL COMPOSE EDITOR -->
  <div x-show="editModal.open" x-cloak x-transition.opacity
       class="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4 bg-black/70 backdrop-blur-md"
       @click.self="closeEditModal()">
    <div class="glass-panel w-full max-w-3xl rounded-t-[28px] sm:rounded-[28px] p-5 sm:p-6 flex flex-col h-[92dvh] sm:max-h-[90vh]"
         style="padding-bottom: calc(1.25rem + env(safe-area-inset-bottom));">
      <div class="sheet-handle sm:hidden"></div>

      <div class="flex items-center justify-between gap-3 pb-3 border-b border-[var(--glass-border)]">
        <div class="min-w-0">
          <h3 class="font-bold text-base truncate" x-text="`${t('editTitle')} — ${editModal.app?.title || ''}`"></h3>
          <p class="text-[11px] text-muted font-mono-code truncate" x-text="editModal.composePath"></p>
        </div>
        <button @click="closeEditModal()" :disabled="editModal.saving" aria-label="Close"
                class="glass-btn w-8 h-8 rounded-full flex items-center justify-center text-muted hover:text-[var(--text-primary)] shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="glass-dock p-1 rounded-2xl grid grid-cols-3 gap-1 mt-3 mb-3 shrink-0">
        <button @click="switchEditTab('ui')" class="py-2 rounded-xl text-xs font-semibold transition"
                :class="editModal.tab === 'ui' ? 'glass-btn-primary' : 'text-muted'" x-text="t('tabVisualUi')"></button>
        <button @click="switchEditTab('yaml')" class="py-2 rounded-xl text-xs font-semibold transition"
                :class="editModal.tab === 'yaml' ? 'glass-btn-primary' : 'text-muted'" x-text="t('tabYamlCode')"></button>
        <button @click="switchEditTab('backups')" class="py-2 rounded-xl text-xs font-semibold transition"
                :class="editModal.tab === 'backups' ? 'glass-btn-primary' : 'text-muted'"
                x-text="`${t('tabBackups')} (${editModal.backups.length})`"></button>

        <label class="glass-inset rounded-2xl p-3.5 flex items-center justify-between gap-3 cursor-pointer">
          <div>
            <p class="font-semibold" x-text="t('unStepImage')"></p>
            <p class="text-[11px] text-muted" x-text="t('unStepImageDesc')"></p>
          </div>
          <input type="checkbox" x-model="uninstallModal.removeImages" class="w-4 h-4 accent-rose-500 shrink-0" />
        </label>
        <div x-show="uninstallModal.app?.appdata_path"

          <label class="flex items-center justify-between gap-3 cursor-pointer">
            <div class="min-w-0">
              <p class="font-semibold text-rose-400" x-text="t('unStepAppdata')"></p>
              <p class="text-[10.5px] text-muted font-mono-code truncate" x-text="uninstallModal.app?.appdata_path"></p>

            <input type="checkbox" x-model="uninstallModal.removeAppdata" class="w-4 h-4 accent-rose-500 shrink-0" />

          confirmStopTitle: 'Dừng ứng dụng này?', confirmStopMsg: 'sẽ ngừng hoạt động và không thể truy cập cho tới khi bạn bật lại.',
          confirmRestartTitle: 'Khởi động lại ứng dụng?', confirmRestartMsg: 'sẽ khởi động lại trong giây lát, các kết nối đang mở có thể bị ngắt.',
          confirmUpdateTitle: 'Xác nhận cập nhật', confirmUpdateMsg: 'Tải image mới nhất và khởi tạo lại container',
          confirmBatchTitle: 'Cập nhật tất cả ứng dụng?', confirmBatchMsg: 'ứng dụng sẽ được cập nhật lần lượt và khởi động lại ngắn. Bạn muốn tiếp tục?',
          confirmRollbackTitle: 'Khôi phục bản sao lưu?', confirmRollbackMsg: 'Ghi đè cấu hình bằng bản sao lưu này và khởi tạo lại container ngay?',
          loadingDetails: 'Đang tải phiên bản & Changelog...', recheck: 'Quét lại',
          autoUpdateApp: 'Tự động cập nhật app này', autoUpdateAppDesc: 'Chạy tự động theo khung giờ trong Cài đặt',
          noChangelog: 'Nhập link GitHub (owner/repo hoặc URL) để tải Releases, CHANGELOG.md hoặc commit mới nhất:',
          save: 'Lưu', noComposeWarning: 'Container không có file docker-compose.yml để cập nhật an toàn.',
          updatingWait: 'Đang cập nhật... Vui lòng không đóng trang',
          settingsTitle: 'Cài đặt & Tự động hóa', tabSchedule: 'Tuỳ chỉnh & Lịch', tabHistory: 'Lịch sử',
          appearance: 'Giao diện', dark: 'Tối', light: 'Sáng', language: 'Ngôn ngữ',
          enableAutoUpdate: 'Bật tự động cập nhật theo lịch', enableAutoUpdateDesc: 'Chỉ tự cập nhật những app bạn đã bật nút Auto riêng',
          autoUpdateTime: 'Giờ chạy mỗi ngày', checkInterval: 'Quét ngầm (giờ)',
          pruneOldImages: 'Tự xoá image cũ sau khi update', pruneOldImagesDesc: 'Giải phóng dung lượng SSD tự động sau mỗi lần cập nhật',
          githubTokenLabel: 'GitHub Token (Tuỳ chọn — tránh giới hạn API & đọc repo Private)',
          saveSettings: 'Lưu cài đặt', noHistory: 'Chưa có lịch sử cập nhật nào.', noApps: 'Không tìm thấy container nào phù hợp.',
          clear: 'Xoá', connectingLogs: 'Đang kết nối luồng log trực tiếp...'
        }
      };

      const gradients = [
        'bg-gradient-to-br from-sky-500 to-indigo-600',
        'bg-gradient-to-br from-emerald-500 to-teal-600',
        'bg-gradient-to-br from-violet-500 to-fuchsia-600',
        'bg-gradient-to-br from-amber-500 to-orange-600'
      ];

      return {
        lang: localStorage.getItem('amp_lang') || 'vi',
        theme: localStorage.getItem('amp_theme') || 'dark',
        bannerDismissKey: localStorage.getItem('amp_banner_dismissed') || '',
        envMode: 'docker',
        apps: [],
        lastChecked: '',
        checkingUpdates: false,
        summary: { total: 0, running: 0, stopped: 0, casaos: 0, docker: 0, updates: 0 },
        search: '',
        filter: 'all',
        loading: true,
        busyId: null,
        error: '',
        toast: { show: false, message: '' },

        confirmModal: { open: false, tone: 'primary', title: '', message: '', confirmLabel: '', onConfirm: null },
        actionSheet: { open: false, app: null },
        logModal: { open: false, title: '', containerName: '', lines: '', ws: null },
        batchModal: { open: false, running: false, items: [], doneCount: 0, succeeded: 0, failed: 0, logs: '', ws: null },
        updateModal: {
          open: false, loading: false, updating: false, app: null,
          changelogHtml: '', changelogError: '', releaseTag: '', releaseUrl: '',
          autoUpdate: false, customRepo: '', showRepoInput: false, updateLogs: '', ws: null
        },
        editModal: {
          open: false, loading: false, saving: false, tab: 'ui',
          app: null, composePath: '', rawYaml: '', ui: null,
          backups: [], feedback: '', feedbackOk: true,
          sec: { container: true, ports: true, volumes: false, env: false, casaos: false }
        },
        uninstallModal: {
          open: false, running: false, app: null,
          removeCompose: true, removeImages: false, removeAppdata: false,
          confirmName: '', error: ''
        },
        settingsModal: { open: false, tab: 'schedule' },
        settingsForm: {
          check_interval_hours: 6, auto_update_enabled: false,
          auto_update_time: '03:30', prune_old_images: true,
          github_token: '', has_github_token: false
        },
        updateHistory: [],
        filterTabs: [
          { id: 'all', labelKey: 'all' },
          { id: 'updates', labelKey: 'tabUpdates' },
          { id: 'running', labelKey: 'tabRunning' },
          { id: 'stopped', labelKey: 'tabStopped' },
          { id: 'casaos', labelKey: 'tabCasaos' },
          { id: 'docker', labelKey: 'tabDocker' },
        ],

        t(key) { return (dict[this.lang] || dict.en)[key] || key; },

        get showUpdateBanner() {
          if (this.summary.updates <= 0) return false;
          const currentKey = `${this.summary.updates}:${this.lastChecked}`;
          return this.bannerDismissKey !== currentKey;
        },

        dismissUpdateBanner() {
          const currentKey = `${this.summary.updates}:${this.lastChecked}`;
          this.bannerDismissKey = currentKey;
          localStorage.setItem('amp_banner_dismissed', currentKey);
        },

        askConfirm({ tone = 'primary', title, message, confirmLabel, onConfirm }) {
          this.confirmModal = { open: true, tone, title, message, confirmLabel, onConfirm };
        },

        closeConfirm() {
          this.confirmModal.open = false;
          this.confirmModal.onConfirm = null;
        },

        runConfirmedAction() {
          const fn = this.confirmModal.onConfirm;
          this.closeConfirm();
          if (typeof fn === 'function') fn();
        },

        confirmStop(app) {
          this.askConfirm({
            tone: 'danger',
            title: this.t('confirmStopTitle'),
            message: `"${app.title}" ${this.t('confirmStopMsg')}`,
            confirmLabel: this.t('stop'),
            onConfirm: () => this.runAction(app, 'stop')
          });
        },

        confirmRestart(app) {
          this.askConfirm({
            tone: 'primary',
            title: this.t('confirmRestartTitle'),
            message: `"${app.title}" ${this.t('confirmRestartMsg')}`,
            confirmLabel: this.t('restart'),
            onConfirm: () => this.runAction(app, 'restart')
          });
        },

        confirmAppUpdate() {
          const app = this.updateModal.app;
          if (!app) return;
          const extra = app.target_tag
            ? (this.lang === 'vi'
                ? ` và nâng tag lên ${app.target_tag}`
                : ` and bump tag to ${app.target_tag}`)
            : '';
          this.askConfirm({
            tone: app.raw_has_update ? 'update' : 'primary',
            title: this.t('confirmUpdateTitle'),
            message: `${this.t('confirmUpdateMsg')} "${app.title}"${extra}?`,
            confirmLabel: app.raw_has_update ? this.t('updateNow') : this.t('forcePull'),
            onConfirm: () => this.startAppUpdate()
          });
        },

        confirmBatchUpdate() {
          this.askConfirm({
            tone: 'update',
            title: this.t('confirmBatchTitle'),
            message: `${this.summary.updates} ${this.t('confirmBatchMsg')}`,
            confirmLabel: `${this.t('updateAll')} (${this.summary.updates})`,
            onConfirm: () => this.startBatchUpdate()
          });
        },

        confirmRollback(filename) {
          this.askConfirm({
            tone: 'update',
            title: this.t('confirmRollbackTitle'),
            message: `${filename} — ${this.t('confirmRollbackMsg')}`,
            confirmLabel: this.t('rollbackBtn'),
            onConfirm: () => this.rollbackCompose(filename)
          });
        },

        async init() {
          await this.loadApps();
          const stale = !this.lastChecked || (Date.now() - new Date(this.lastChecked).getTime()) > 3600000;
          if (stale && !this.checkingUpdates) this.checkUpdates(true);
        },

        handleShortcut(e) {
          if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA' && this.$refs.searchInput) {
            e.preventDefault(); this.$refs.searchInput.focus();
          }
        },

        avatarGradient(title) {
          let h = 0;
          for (let i = 0; i < title.length; i++) h = title.charCodeAt(i) + ((h << 5) - h);
          return gradients[Math.abs(h) % gradients.length];
        },

        shortImage(img) { return (img || '').replace(/^docker\.io\/(library\/)?/, ''); },

        formatRelativeTime(iso) {
          if (!iso) return '';
          const mins = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 60000));
          if (mins < 1) return this.lang === 'vi' ? 'vừa xong' : 'just now';
          if (mins < 60) return `${mins}m`;
          const hrs = Math.floor(mins / 60);
          return `${hrs}h ${mins % 60}m`;
        },

        setLang(code) { this.lang = code; localStorage.setItem('amp_lang', code); },

        setTheme(mode) {
          this.theme = mode; localStorage.setItem('amp_theme', mode);
          const isLight = mode === 'light';
          document.documentElement.classList.toggle('light', isLight);
          document.documentElement.classList.toggle('dark', !isLight);
          document.getElementById('meta-theme-color').setAttribute('content', isLight ? '#e5eef9' : '#090f1d');
        },

        showToast(msg) {
          this.toast.message = msg; this.toast.show = true;
          clearTimeout(this._toastTimer);
          this._toastTimer = setTimeout(() => { this.toast.show = false; }, 2800);
        },

        countForTab(tabId) { return tabId === 'all' ? this.summary.total : (this.summary[tabId] || 0); },

        get filteredApps() {
          const q = this.search.trim().toLowerCase();
          return this.apps.filter(a => {
            if (this.filter === 'updates' && !a.has_update) return false;
            if (this.filter === 'running' && a.status !== 'running') return false;
            if (this.filter === 'stopped' && a.status === 'running') return false;
            if (this.filter === 'casaos' && a.source !== 'casaos') return false;
            if (this.filter === 'docker' && a.source !== 'docker') return false;
            if (!q) return true;
            return a.title.toLowerCase().includes(q) || a.name.toLowerCase().includes(q) || a.image.toLowerCase().includes(q);
          });
        },

        buildWebUrl(app) {
          const idx = app.index && app.index.startsWith('/') ? app.index : `/${app.index || ''}`;
          return `${app.scheme || 'http'}://${window.location.hostname}:${app.port_map}${idx}`;
        },

        async loadApps() {
          this.loading = true;
          try {
            const res = await fetch('/api/apps');
            if (res.status === 401) { window.location.href = '/login'; return; }
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Failed to load apps');
            this.envMode = data.environment;
            this.summary = data.summary;
            this.apps = data.apps;
            this.lastChecked = data.last_checked || '';
            this.checkingUpdates = !!data.checking_updates;
          } catch (err) { this.error = err.message; }
          finally { this.loading = false; }
        },

        async checkUpdates(silent = false) {
          this.checkingUpdates = true;
          if (!silent) {
            this.bannerDismissKey = '';
            localStorage.removeItem('amp_banner_dismissed');
          }
          try {
            const res = await fetch('/api/updates/check', { method: 'POST' });
            await this.loadApps();
            if (!silent && res.ok) {
              const found = this.summary.updates;
              this.showToast(found > 0
                ? `${found} ${this.t('updatesAvailable')}`
                : (this.lang === 'vi' ? 'Tất cả ứng dụng đều đang ở bản mới nhất ✓' : 'All apps are up to date ✓'));
            }
          } catch (err) { if (!silent) this.error = err.message; }
          finally { this.checkingUpdates = false; }
        },

        openActionSheet(app) { this.actionSheet.app = app; this.actionSheet.open = true; },
        closeActionSheet() { this.actionSheet.open = false; },

        async openUpdateModal(app) {
          this.updateModal.open = true;
          this.updateModal.loading = true;
          this.updateModal.updating = false;
          this.updateModal.showRepoInput = false;
          this.updateModal.updateLogs = '';
          this.updateModal.app = app;
          await this._fetchAppDetails(app.name, false);
        },

        async _fetchAppDetails(name, refresh) {
          this.updateModal.loading = true;
          try {
            const res = await fetch(`/api/apps/${encodeURIComponent(name)}/details?refresh=${refresh ? 'true' : 'false'}`);
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Failed');
            this.updateModal.app = data.app;
            this.updateModal.releaseTag = data.release_tag || '';
            this.updateModal.releaseUrl = data.release_url || '';
            this.updateModal.changelogError = data.changelog_error || '';
            this.updateModal.autoUpdate = !!data.pref?.auto_update;
            this.updateModal.customRepo = data.pref?.custom_repo || data.app?.source_url || '';
            this.updateModal.changelogHtml = data.changelog ? DOMPurify.sanitize(marked.parse(data.changelog)) : '';
            if (this.updateModal.changelogHtml) this.updateModal.showRepoInput = false;
          } catch (err) { this.showToast(err.message); }
          finally { this.updateModal.loading = false; }
        },

        async refreshSingleApp() {
          if (!this.updateModal.app) return;
          await this._fetchAppDetails(this.updateModal.app.name, true);
          await this.loadApps();
        },

        async saveAppPref() {
          if (!this.updateModal.app) return;
          await fetch(`/api/apps/${encodeURIComponent(this.updateModal.app.name)}/prefs`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ auto_update: this.updateModal.autoUpdate })
          });
          this.showToast(this.lang === 'vi' ? 'Đã lưu Auto-Update' : 'Auto-Update saved');
          await this.loadApps();
        },

        async toggleSkipUpdate() {
          const app = this.updateModal.app;
          if (!app) return;
          const nextToken = app.is_skipped ? '' : (app.skip_token || '');
          await fetch(`/api/apps/${encodeURIComponent(app.name)}/prefs`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ skipped_digest: nextToken })
          });
          this.showToast(nextToken
            ? (this.lang === 'vi' ? 'Đã bỏ qua bản cập nhật này' : 'Version skipped')
            : (this.lang === 'vi' ? 'Đã hiện lại thông báo cập nhật' : 'Version unskipped'));
          await this._fetchAppDetails(app.name, false);
          await this.loadApps();
        },

        async saveCustomRepo() {
          if (!this.updateModal.app) return;
          this.updateModal.loading = true;
          await fetch(`/api/apps/${encodeURIComponent(this.updateModal.app.name)}/prefs`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ custom_repo: this.updateModal.customRepo })
          });
          await this._fetchAppDetails(this.updateModal.app.name, false);
          await this.loadApps();
        },

        startAppUpdate() {
          if (!this.updateModal.app) return;
          this.updateModal.updating = true; this.updateModal.updateLogs = '';
          const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
          const ws = new WebSocket(`${proto}//${window.location.host}/ws/update/${encodeURIComponent(this.updateModal.app.name)}`);
          this.updateModal.ws = ws;
          ws.onmessage = (event) => {
            if (event.data.includes('__SELF_UPDATE_RELOAD__')) { setTimeout(() => window.location.reload(), 10000); return; }
            this.updateModal.updateLogs += event.data;
            this.$nextTick(() => { const b = this.$refs.updateLogBox; if (b) b.scrollTop = b.scrollHeight; });
          };
          ws.onclose = async () => { this.updateModal.updating = false; this.updateModal.ws = null; await this.loadApps(); };
        },

        closeUpdateModal() {
          if (this.updateModal.updating) return;
          if (this.updateModal.ws) this.updateModal.ws.close();
          this.updateModal.open = false;
        },

        async openEditModal(app) {
          this.editModal.open = true;
          this.editModal.loading = true;
          this.editModal.saving = false;
          this.editModal.tab = 'ui';
          this.editModal.app = app;
          this.editModal.feedback = '';
          this.editModal.sec = { container: true, ports: true, volumes: false, env: false, casaos: false };
          try {
            const res = await fetch(`/api/apps/${encodeURIComponent(app.name)}/compose`);
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Cannot load compose file');
            this.editModal.composePath = data.compose_path;
            this.editModal.rawYaml = data.raw_yaml;
            this.editModal.ui = data.ui;
            this.editModal.backups = data.backups || [];
          } catch (err) {
            this.editModal.feedbackOk = false;
            this.editModal.feedback = err.message;
          } finally {
            this.editModal.loading = false;
          }
        },

        async reloadServiceUi() {
          if (!this.editModal.app) return;
          const res = await fetch(`/api/apps/${encodeURIComponent(this.editModal.app.name)}/compose/to-ui`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ raw_yaml: this.editModal.rawYaml, selected_service: this.editModal.ui.selected_service })
          });
          if (res.ok) { const d = await res.json(); this.editModal.ui = d.ui; }
        },

        async _syncUiToYaml() {
          if (!this.editModal.ui || !this.editModal.app) return true;
          const res = await fetch(`/api/apps/${encodeURIComponent(this.editModal.app.name)}/compose/to-yaml`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ base_yaml: this.editModal.rawYaml, ui: this.editModal.ui })
          });
          const data = await res.json();
          if (!res.ok) { this.editModal.feedbackOk = false; this.editModal.feedback = data.detail || 'Sync error'; return false; }
          this.editModal.rawYaml = data.raw_yaml;
          return true;
        },

        async switchEditTab(nextTab) {
          if (nextTab === this.editModal.tab) return;
          this.editModal.feedback = '';
          if (this.editModal.tab === 'ui' && (nextTab === 'yaml' || nextTab === 'backups')) {
            if (!(await this._syncUiToYaml())) return;
          } else if (this.editModal.tab === 'yaml' && nextTab === 'ui') {
            const res = await fetch(`/api/apps/${encodeURIComponent(this.editModal.app.name)}/compose/to-ui`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ raw_yaml: this.editModal.rawYaml, selected_service: this.editModal.ui?.selected_service })
            });
            const data = await res.json();
            if (!res.ok) { this.editModal.feedbackOk = false; this.editModal.feedback = `YAML Error: ${data.detail}`; return; }
            this.editModal.ui = data.ui;
          }
          this.editModal.tab = nextTab;
        },

        async validateCompose() {
          if (this.editModal.tab === 'ui' && !(await this._syncUiToYaml())) return;
          const res = await fetch(`/api/apps/${encodeURIComponent(this.editModal.app.name)}/compose/validate`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ raw_yaml: this.editModal.rawYaml })
          });
          const data = await res.json();
          this.editModal.feedbackOk = !!data.ok;
          this.editModal.feedback = data.message || data.detail || '';
        },

        async applyCompose() {
          this.editModal.saving = true; this.editModal.feedback = '';
          try {
            if (this.editModal.tab === 'ui' && !(await this._syncUiToYaml())) { this.editModal.saving = false; return; }
            const res = await fetch(`/api/apps/${encodeURIComponent(this.editModal.app.name)}/compose/apply`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ raw_yaml: this.editModal.rawYaml })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Apply failed');
            this.editModal.backups = data.backups || this.editModal.backups;
            this.showToast(this.lang === 'vi' ? 'Đã áp dụng cấu hình mới ✓' : 'Configuration applied ✓');
            if (data.self_update) setTimeout(() => window.location.reload(), 9000);
            this.editModal.open = false;
            await this.loadApps();
          } catch (err) { this.editModal.feedbackOk = false; this.editModal.feedback = err.message; }
          finally { this.editModal.saving = false; }
        },

        async rollbackCompose(filename) {
          this.editModal.saving = true; this.editModal.feedback = '';
          try {
            const res = await fetch(`/api/apps/${encodeURIComponent(this.editModal.app.name)}/compose/rollback`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ filename })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Rollback failed');
            this.showToast(this.lang === 'vi' ? 'Đã khôi phục bản sao lưu ✓' : 'Rolled back ✓');
            this.editModal.open = false;
            await this.loadApps();
          } catch (err) { this.editModal.feedbackOk = false; this.editModal.feedback = err.message; }
          finally { this.editModal.saving = false; }
        },

        closeEditModal() { if (!this.editModal.saving) this.editModal.open = false; },

        openUninstallModal(app) {
          this.uninstallModal = {
            open: true, running: false, app,
            removeCompose: app.source === 'casaos',
            removeImages: false, removeAppdata: false, confirmName: '', error: ''
          };
        },

        async confirmUninstall() {
          const app = this.uninstallModal.app;
          if (!app) return;
          this.uninstallModal.running = true; this.uninstallModal.error = '';
          try {
            const res = await fetch(`/api/apps/${encodeURIComponent(app.name)}/uninstall`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                remove_compose: this.uninstallModal.removeCompose,
                remove_images: this.uninstallModal.removeImages,
                remove_appdata: this.uninstallModal.removeAppdata,
                confirm_name: this.uninstallModal.confirmName
              })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Uninstall failed');
            this.uninstallModal.open = false;
            this.showToast(`${app.title}: ${this.lang === 'vi' ? 'Đã gỡ cài đặt ✓' : 'Uninstalled ✓'}`);
            await this.loadApps();
          } catch (err) { this.uninstallModal.error = err.message; }
          finally { this.uninstallModal.running = false; }
        },

        startBatchUpdate() {
          this.batchModal = { open: true, running: true, items: [], doneCount: 0, succeeded: 0, failed: 0, logs: '', ws: null };
          const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
          const ws = new WebSocket(`${proto}//${window.location.host}/ws/update-all`);
          this.batchModal.ws = ws;
          ws.onmessage = (event) => {
            try {
              const msg = JSON.parse(event.data);
              if (msg.type === 'init') this.batchModal.items = msg.apps || [];
              else if (msg.type === 'app_start' && this.batchModal.items[msg.index]) this.batchModal.items[msg.index].status = 'running';
              else if (msg.type === 'log' && !msg.text.includes('__SELF_UPDATE_RELOAD__')) {
                this.batchModal.logs += msg.text;
                this.$nextTick(() => { const b = this.$refs.batchLogBox; if (b) b.scrollTop = b.scrollHeight; });
              }
              else if (msg.type === 'app_done') {
                if (this.batchModal.items[msg.index]) this.batchModal.items[msg.index].status = msg.ok ? 'success' : 'failed';
                this.batchModal.doneCount += 1;
              }
              else if (msg.type === 'complete') {
                this.batchModal.succeeded = msg.succeeded; this.batchModal.failed = msg.failed;
                this.batchModal.running = false;
                if (msg.self_update) setTimeout(() => window.location.reload(), 10000);
              }
            } catch (_) {}
          };
          ws.onclose = async () => { this.batchModal.running = false; this.batchModal.ws = null; await this.loadApps(); };
        },

        closeBatchModal() {
          if (this.batchModal.running) return;
          if (this.batchModal.ws) this.batchModal.ws.close();
          this.batchModal.open = false;
        },

        async openSettings() {
          this.settingsModal.open = true;
          const res = await fetch('/api/settings');
          if (res.ok) {
            const data = await res.json();
            this.settingsForm = { ...data.settings, github_token: '' };
            this.updateHistory = data.history || [];
          }
        },

        async saveSettings() {
          const payload = {
            check_interval_hours: this.settingsForm.check_interval_hours,
            auto_update_enabled: this.settingsForm.auto_update_enabled,
            auto_update_time: this.settingsForm.auto_update_time,
            prune_old_images: this.settingsForm.prune_old_images
          };
          if (this.settingsForm.github_token.trim()) payload.github_token = this.settingsForm.github_token.trim();
          const res = await fetch('/api/settings', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (res.ok) {
            this.showToast(this.lang === 'vi' ? 'Đã lưu cài đặt ✓' : 'Settings saved ✓');
            this.settingsModal.open = false;
          }
        },

        async runAction(app, action) {
          this.busyId = app.id;
          try {
            const res = await fetch(`/api/apps/${app.id}/${action}`, { method: 'POST' });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Action failed');
            this.showToast(`${app.title}: ${action} OK`);
            await this.loadApps();
          } catch (err) { this.error = err.message; }
          finally { this.busyId = null; }
        },

        openLogs(app) {
          this.closeLogs();
          this.logModal = { open: true, title: app.title, containerName: app.name, lines: '', ws: null };
          const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
          const ws = new WebSocket(`${proto}//${window.location.host}/ws/logs/${app.id}`);
          this.logModal.ws = ws;
          ws.onmessage = (event) => {
            this.logModal.lines += event.data;
            this.$nextTick(() => { const b = this.$refs.logBox; if (b) b.scrollTop = b.scrollHeight; });
          };
        },

        closeLogs() {
          if (this.logModal.ws) { this.logModal.ws.close(); this.logModal.ws = null; }
          this.logModal.open = false;
        },

        async logout() {
          await fetch('/api/auth/logout', { method: 'POST' });
          window.location.href = '/login';
        }
      };
    }
  </script>
</body>
</html>
