version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "America/Denver"
    commit-message:
      prefix: "fix"
      include: "scope"
    labels: ["dependencies"]
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "America/Denver"
    commit-message:
      prefix: "fix"
      include: "scope"
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "America/Denver"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels: ["dependencies"]
