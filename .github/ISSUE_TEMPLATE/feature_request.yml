name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or use case — what you are trying to achieve.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it could work in AppManager (screenshots or sketches welcome).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other tools you use today.
