name: Auto Update, Build & Release

# Chạy: mỗi ngày (kiểm tra bản mới của base image/thư viện), mỗi lần bạn push lên main, hoặc bấm tay.
# Push / lịch hằng ngày: chỉ nâng thành phần + build image `latest` (KHÔNG tăng số phiên bản, không tạo Release).
# Phát hành (CHANGELOG + Release + tag X.Y.Z) chỉ khi bấm tay: force_release=true, version=X.Y.Z.
on:
  schedule:
    - cron: "0 10 * * *"
  push:
    branches: [main]
    paths-ignore:            # sửa tài liệu không cần build lại image
      - "**.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      force_release:
        description: "Tạo release mới dù không có thành phần nào cập nhật"
        type: boolean
        default: false
      version:
        description: "Số phiên bản muốn phát hành (vd 1.0.0). Để trống = tự tăng bản vá"
        type: string
        default: ""

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ═══════ 1. Kiểm tra bản mới → sửa file → viết changelog → commit (GitHub ký) ═══════
  update:
    name: Check updates & commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.final.outputs.changed }}
      release: ${{ steps.final.outputs.release }}
      version: ${{ steps.final.outputs.version }}
      head_sha: ${{ steps.head.outputs.sha }}
      short_sha: ${{ steps.head.outputs.short }}
      image: ${{ steps.head.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Tools
        run: pip install --quiet jinja2 packaging

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # Cho các lệnh "docker buildx build" trong verify.sh đọc cache GHA (do bước build & push ghi):
      # lớp apt / pip không đổi -> không build lại (nhất là bản arm64 chạy giả lập QEMU rất chậm)
      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Check source
        run: |
          python -m compileall -q app scripts
          python scripts/check_project.py
          node --check app/static/js/app.js
          node --check app/static/js/i18n.js

      # ── Lần 1: nâng TẤT CẢ lên bản mới nhất (kể cả major mới) ──
      - name: Look for updates (latest versions)
        id: upd
        env:
          UPDATE_POLICY: latest
          BUMP_ACTIONS: ${{ secrets.WORKFLOW_TOKEN != '' }}
          FORCE_RELEASE: ${{ github.event.inputs.force_release }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          NO_RELEASE: ${{ github.event_name != 'workflow_dispatch' }}
        run: python scripts/auto_update.py check

      - name: Verify latest versions (build image + start app)
        id: verify
        if: steps.upd.outputs.changed == 'true'
        continue-on-error: true
        run: BUILDX_CACHE_FROM=type=gha VERIFY_ARM64=1 bash scripts/verify.sh amp-latest smoke

      # ── Lần 2 (chỉ khi lần 1 hỏng): nâng trong cùng major, ghi chú vào changelog ──
      - name: Fallback — same-major updates only
        id: safe
        if: steps.upd.outputs.changed == 'true' && steps.verify.outcome == 'failure'
        env:
          UPDATE_POLICY: safe
          HELD_BACK: "true"
          BUMP_ACTIONS: ${{ secrets.WORKFLOW_TOKEN != '' }}
          FORCE_RELEASE: ${{ github.event.inputs.force_release }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          NO_RELEASE: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          git checkout -- .
          rm -rf release
          python scripts/auto_update.py check

      - name: Verify same-major versions
        if: steps.safe.outputs.changed == 'true'
        run: BUILDX_CACHE_FROM=type=gha VERIFY_ARM64=1 bash scripts/verify.sh amp-safe smoke

      - name: Pick result
        id: final
        env:
          USE_SAFE: ${{ steps.verify.outcome == 'failure' }}
          U_CHANGED: ${{ steps.upd.outputs.changed }}
          U_RELEASE: ${{ steps.upd.outputs.release }}
          S_RELEASE: ${{ steps.safe.outputs.release }}
          U_VERSION: ${{ steps.upd.outputs.version }}
          U_SUMMARY: ${{ steps.upd.outputs.summary }}
          S_CHANGED: ${{ steps.safe.outputs.changed }}
          S_VERSION: ${{ steps.safe.outputs.version }}
          S_SUMMARY: ${{ steps.safe.outputs.summary }}
        run: |
          if [ "$USE_SAFE" = "true" ]; then
            CHANGED="${S_CHANGED:-false}"; VERSION="$S_VERSION"; SUMMARY="$S_SUMMARY (major upgrades held back)"; RELEASE="${S_RELEASE:-false}"
          else
            CHANGED="${U_CHANGED:-false}"; VERSION="$U_VERSION"; SUMMARY="$U_SUMMARY"; RELEASE="${U_RELEASE:-false}"
          fi
          {
            echo "changed=$CHANGED"
            echo "release=$RELEASE"
            echo "version=$VERSION"
            echo "summary=$SUMMARY"
          } >> "$GITHUB_OUTPUT"
          echo "### Update result" >> "$GITHUB_STEP_SUMMARY"
          echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

      # Không có cập nhật thành phần nhưng bạn vừa push code -> vẫn build & khởi động thử trước khi phát hành image
      - name: Verify current code
        if: steps.final.outputs.changed != 'true' && github.event_name != 'schedule'
        run: BUILDX_CACHE_FROM=type=gha bash scripts/verify.sh amp-current smoke

      - name: Commit (signed by GitHub)
        if: steps.final.outputs.changed == 'true'
        env:
          # Token riêng (secret WORKFLOW_TOKEN, quyền Contents + Workflows) để được sửa .github/workflows;
          # không có thì dùng token mặc định. [skip ci]: commit bằng token riêng sẽ kích hoạt workflow mới.
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.final.outputs.version }}
          SUMMARY: ${{ steps.final.outputs.summary }}
        run: |
          if [ -n "$VERSION" ]; then MSG="chore(deps): update components to v${VERSION} [skip ci]"; else MSG="chore(deps): update components (no release) [skip ci]"; fi
          python scripts/signed_commit.py --branch main \
            --message "$MSG"$'\n\n'"${SUMMARY}" \
            --files-from release/changed_files.txt > new_sha.txt

      # Chỉ có action trong workflow được nâng (không có bản phát hành): commit riêng, không build lại image
      - name: Commit workflow action updates (signed by GitHub)
        if: steps.final.outputs.changed != 'true' && hashFiles('release/workflow_files.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          SUMMARY: ${{ steps.safe.outputs.actions_summary || steps.upd.outputs.actions_summary }}
        run: |
          python scripts/signed_commit.py --branch main \
            --message "ci: update GitHub Actions [skip ci]"$'\n\n'"${SUMMARY}" \
            --files-from release/workflow_files.txt > /dev/null

      - name: Resolve head
        id: head
        run: |
          # Build đúng commit vừa được kiểm tra (commit của bot nếu có, nếu không thì commit đã checkout)
          if [ -s new_sha.txt ]; then SHA=$(tr -d '[:space:]' < new_sha.txt); else SHA=$(git rev-parse HEAD); fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  # ═══════ 2. Build image trên GitHub, ký (attestation) & đẩy lên GHCR ═══════
  build:
    name: Build, sign & push image
    needs: update
    # Lịch chạy hằng ngày chỉ build khi có thay đổi (tránh đổi digest `latest` mỗi ngày -> app báo cập nhật ảo)
    if: needs.update.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      scan: ${{ steps.scan_sum.outputs.summary }}
    env:
      # Đẩy thêm lên Docker Hub khi có secret DOCKERHUB_USERNAME + DOCKERHUB_TOKEN (GHCR vẫn là nguồn chính)
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.update.outputs.head_sha }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: App version (image label)
        id: appver
        # Nhãn org.opencontainers.image.version = APP_VERSION thật (không phải "latest"): AppManager đọc nhãn này để biết
        # bản build lại cùng số phiên bản, không lấy tên bản phát hành cũ trong bộ đệm.
        run: echo "v=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' app/core/docker_client.py)" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.update.outputs.image }}
          tags: type=raw,value=latest
          labels: org.opencontainers.image.version=${{ steps.appver.outputs.v }}

      - name: Image tags
        id: tags
        env:
          IMAGE: ${{ needs.update.outputs.image }}
          SHORT: ${{ needs.update.outputs.short_sha }}
          CHANGED: ${{ needs.update.outputs.release }}
          VERSION: ${{ needs.update.outputs.version }}
        run: |
          IMAGES="$IMAGE"
          if [ "$DOCKERHUB_ENABLED" = "true" ]; then
            HUB="docker.io/${DOCKERHUB_USER,,}/${GITHUB_REPOSITORY#*/}"
            IMAGES="$IMAGES $HUB"
            echo "hub=$HUB" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "list<<EOF"
            for img in $IMAGES; do
              echo "$img:latest"
              echo "$img:build-$SHORT"
              if [ "$CHANGED" = "true" ] && [ -n "$VERSION" ]; then echo "$img:$VERSION"; fi
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.list }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign image (GitHub build provenance attestation)
        uses: actions/attest@v4
        with:
          subject-name: ${{ needs.update.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign Docker Hub image (attestation)
        if: env.DOCKERHUB_ENABLED == 'true'
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.tags.outputs.hub }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Mô tả trang Docker Hub lấy từ README (token cần quyền Read, Write, Delete; thiếu quyền thì chỉ bỏ qua bước này)
      # Docker Hub giới hạn 25 000 byte: bỏ các mục dành cho người phát triển, đổi link tương đối thành link GitHub
      - name: Prepare Docker Hub README
        if: env.DOCKERHUB_ENABLED == 'true' && (needs.update.outputs.release == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          python3 - <<'PY'
          import re
          s = open("README.md", encoding="utf-8").read()
          for title in ("🤖 Automated builds & releases", "🗂️ Project structure", "🔌 API reference", "🛠️ Development"):
              s = re.sub(r"^## " + re.escape(title) + r".*?(?=^## )", "", s, flags=re.S | re.M)
          import os
          repo = os.environ["GITHUB_REPOSITORY"]
          # Thẻ HTML (<img src>, <a href>) dùng đường dẫn tương đối không được Docker Hub tự sửa -> đổi sang URL tuyệt đối
          raw = f"https://raw.githubusercontent.com/{repo}/main/"
          blob = f"https://github.com/{repo}/blob/main/"
          s = re.sub(r'(src=")(?!https?://|data:|#)([^"]+)"', lambda m: f'{m.group(1)}{raw}{m.group(2).lstrip("./")}"', s)
          s = re.sub(r'(href=")(?!https?://|mailto:|#)([^"]+)"', lambda m: f'{m.group(1)}{blob}{m.group(2).lstrip("./")}"', s)
          s += "\n\n> Full documentation: https://github.com/boystyle2010/appmanager-pro\n"
          b = s.encode("utf-8")
          if len(b) > 24500:
              s = b[:24400].decode("utf-8", "ignore") + "\n\n… Full documentation: https://github.com/boystyle2010/appmanager-pro\n"
          open("dockerhub-README.md", "w", encoding="utf-8").write(s)
          print("Docker Hub README:", len(s.encode("utf-8")), "bytes")
          PY

      - name: Sync Docker Hub description
        if: env.DOCKERHUB_ENABLED == 'true' && (needs.update.outputs.release == 'true' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ format('{0}/{1}', secrets.DOCKERHUB_USERNAME, github.event.repository.name) }}
          short-description: "Fast Docker & CasaOS app manager: digest-based update checks, changelogs, safe compose editing, automatic rollback."
          readme-filepath: ./dockerhub-README.md
          enable-url-completion: true

      # Quét lỗ hổng image vừa build (không chặn release; kết quả ghi vào Release notes).
      # Ghim theo commit SHA (v0.36.0) vì các tag cũ của trivy-action từng bị chiếm quyền (GHSA-69fq-xp46-6x23).
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ needs.update.outputs.image }}@${{ steps.build.outputs.digest }}
          format: json
          output: trivy.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore   # CVE tạm bỏ qua, có lý do & hạn
          exit-code: "0"

      - name: Summarize scan
        id: scan_sum
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from collections import Counter
          summary = "scan unavailable"
          rows, where = [], Counter()
          try:
              data = json.load(open("trivy.json"))
              crit = high = 0
              for r in data.get("Results") or []:
                  for v in r.get("Vulnerabilities") or []:
                      sev = v.get("Severity")
                      if sev not in ("CRITICAL", "HIGH"):
                          continue
                      crit += sev == "CRITICAL"
                      high += sev == "HIGH"
                      pkg = v.get("PkgName", "?")
                      tgt = r.get("Target", "")
                      label = pkg if r.get("Class") == "os-pkgs" else f"{pkg} in {os.path.basename(tgt) or tgt}"
                      where[label] += 1
                      rows.append(f"| {sev} | {v.get('VulnerabilityID','')} | {pkg} | {v.get('InstalledVersion','')} | {v.get('FixedVersion','')} | {r.get('Target','')} |")
              summary = f"{crit} critical • {high} high (fixable only)"
              if where:
                  summary += " — " + ", ".join(f"{p} ×{n}" for p, n in where.most_common(4))
          except Exception as exc:
              print("No scan result:", exc)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"summary={summary}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### Trivy scan\n{summary}\n\n")
              if rows:
                  f.write("| Severity | ID | Package | Installed | Fixed in | Target |\n|---|---|---|---|---|---|\n")
                  f.write("\n".join(rows[:60]) + "\n")
          PY

  # ═══════ 3. Thêm mục Package Integrity vào changelog & tạo GitHub Release ═══════
  release:
    name: Publish GitHub Release
    needs: [update, build]
    if: needs.update.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.update.outputs.head_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Add Package Integrity to changelog
        env:
          SCAN: ${{ needs.build.outputs.scan }}
        run: |
          python scripts/auto_update.py integrity \
            --image "${{ needs.update.outputs.image }}" \
            --digest "${{ needs.build.outputs.digest }}" \
            --version "${{ needs.update.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --scan "$SCAN"

      - name: Commit changelog (signed by GitHub)
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(python scripts/signed_commit.py --branch main \
            --message "docs: package integrity for v${{ needs.update.outputs.version }}" \
            --files-from release/changed_files.txt)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.update.outputs.version }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Đã có Release cùng số (chạy lại) -> chỉ cập nhật ghi chú
            gh release edit "$TAG" --notes-file release/body.md --latest
          else
            gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file release/body.md --latest
          fi
