name: Auto Update, Build & Release

# Chạy: mỗi ngày (kiểm tra bản mới của base image/thư viện), mỗi lần bạn push lên main, hoặc bấm tay.
on:
  schedule:
    - cron: "0 10 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_release:
        description: "Tạo release mới dù không có thành phần nào cập nhật"
        type: boolean
        default: false
      version:
        description: "Số phiên bản muốn phát hành (vd 1.0.0). Để trống = tự tăng bản vá"
        type: string
        default: ""

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ═══════ 1. Kiểm tra bản mới → sửa file → viết changelog → commit (GitHub ký) ═══════
  update:
    name: Check updates & commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.upd.outputs.changed }}
      version: ${{ steps.upd.outputs.version }}
      head_sha: ${{ steps.head.outputs.sha }}
      short_sha: ${{ steps.head.outputs.short }}
      image: ${{ steps.head.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Tools
        run: pip install --quiet jinja2 packaging

      - name: Check source (before update)
        run: |
          python -m compileall -q app scripts
          python scripts/check_project.py
          node --check app/static/js/app.js
          node --check app/static/js/i18n.js

      # Thử khởi động app với thư viện hiện tại; nếu môi trường CI không import được thì bỏ qua bước thử sau khi nâng
      - name: Baseline smoke test
        id: baseline
        continue-on-error: true
        run: |
          python -m venv "$RUNNER_TEMP/venv-base"
          "$RUNNER_TEMP/venv-base/bin/pip" install --quiet -r requirements.txt
          APP_DATA_DIR="$RUNNER_TEMP/data-base" "$RUNNER_TEMP/venv-base/bin/python" -c "import app.main"

      - name: Look for updates & write changelog
        id: upd
        env:
          FORCE_RELEASE: ${{ github.event.inputs.force_release }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: python scripts/auto_update.py check

      - name: Verify updated version
        if: steps.upd.outputs.changed == 'true'
        run: |
          python -m compileall -q app scripts
          python scripts/check_project.py
          node --check app/static/js/app.js
          node --check app/static/js/i18n.js
          if [ "${{ steps.baseline.outcome }}" = "success" ]; then
            python -m venv "$RUNNER_TEMP/venv-new"
            "$RUNNER_TEMP/venv-new/bin/pip" install --quiet -r requirements.txt
            APP_DATA_DIR="$RUNNER_TEMP/data-new" "$RUNNER_TEMP/venv-new/bin/python" -c "import app.main"
          fi

      - name: Commit (signed by GitHub)
        if: steps.upd.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.upd.outputs.version }}
          SUMMARY: ${{ steps.upd.outputs.summary }}
        run: |
          python scripts/signed_commit.py --branch main \
            --message "chore(deps): update components to v${VERSION}"$'\n\n'"${SUMMARY}" \
            --files-from release/changed_files.txt > new_sha.txt

      - name: Resolve head
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  # ═══════ 2. Build image trên GitHub, ký (attestation) & đẩy lên GHCR ═══════
  build:
    name: Build, sign & push image
    needs: update
    # Lịch chạy hằng ngày chỉ build khi có thay đổi (tránh đổi digest `latest` mỗi ngày -> app báo cập nhật ảo)
    if: needs.update.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      scan: ${{ steps.scan_sum.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.update.outputs.head_sha }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.update.outputs.image }}
          tags: type=raw,value=latest

      - name: Image tags
        id: tags
        env:
          IMAGE: ${{ needs.update.outputs.image }}
          SHORT: ${{ needs.update.outputs.short_sha }}
          CHANGED: ${{ needs.update.outputs.changed }}
          VERSION: ${{ needs.update.outputs.version }}
        run: |
          {
            echo "list<<EOF"
            echo "$IMAGE:latest"
            echo "$IMAGE:build-$SHORT"
            if [ "$CHANGED" = "true" ] && [ -n "$VERSION" ]; then echo "$IMAGE:$VERSION"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.list }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign image (GitHub build provenance attestation)
        uses: actions/attest@v4
        with:
          subject-name: ${{ needs.update.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Quét lỗ hổng image vừa build (không chặn release; kết quả ghi vào Release notes).
      # Ghim theo commit SHA (v0.36.0) vì các tag cũ của trivy-action từng bị chiếm quyền (GHSA-69fq-xp46-6x23).
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ needs.update.outputs.image }}@${{ steps.build.outputs.digest }}
          format: json
          output: trivy.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Summarize scan
        id: scan_sum
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          summary = "scan unavailable"
          try:
              data = json.load(open("trivy.json"))
              crit = high = 0
              for r in data.get("Results") or []:
                  for v in r.get("Vulnerabilities") or []:
                      sev = v.get("Severity")
                      crit += sev == "CRITICAL"
                      high += sev == "HIGH"
              summary = f"{crit} critical • {high} high (fixable only)"
          except Exception as exc:
              print("No scan result:", exc)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"summary={summary}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### Trivy scan\n{summary}\n")
          PY

  # ═══════ 3. Thêm mục Package Integrity vào changelog & tạo GitHub Release ═══════
  release:
    name: Publish GitHub Release
    needs: [update, build]
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.update.outputs.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add Package Integrity to changelog
        env:
          SCAN: ${{ needs.build.outputs.scan }}
        run: |
          python scripts/auto_update.py integrity \
            --image "${{ needs.update.outputs.image }}" \
            --digest "${{ needs.build.outputs.digest }}" \
            --version "${{ needs.update.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --scan "$SCAN"

      - name: Commit changelog (signed by GitHub)
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(python scripts/signed_commit.py --branch main \
            --message "docs: package integrity for v${{ needs.update.outputs.version }}" \
            --files-from release/changed_files.txt)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.update.outputs.version }}" \
            --target "${{ steps.commit.outputs.sha }}" \
            --title "v${{ needs.update.outputs.version }}" \
            --notes-file release/body.md \
            --latest
