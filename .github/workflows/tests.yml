name: Tests

# Kiểm tra mã + các bộ test Docker thật (tests/docker/run_ci.sh) cho mỗi push và pull request.
on:
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Code checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install
        run: pip install --quiet -r requirements.txt jinja2 pyflakes
      - name: Python
        run: |
          python -m compileall -q app scripts
          python -m pyflakes app scripts tests
          python scripts/check_project.py
      - name: JavaScript
        run: |
          node --check app/static/js/app.js
          node --check app/static/js/i18n.js
          node --check app/static/js/notify-icons.js

  docker:
    name: Docker scenarios
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      S: ${{ github.workspace }}/.scratch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --quiet -r requirements.txt cryptography
      - name: Prepare test environment (registry, ntfy, Gotify, images)
        run: bash tests/docker/ci_setup.sh
      - name: Run scenarios
        run: bash tests/docker/run_ci.sh
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-test-logs
          path: |
            .scratch/*.out
            .scratch/*.log
          if-no-files-found: ignore
